<head><!--repo-only-->

<title>Chordtroller Omni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument face. Chord keys on the left, the strumplate as a full-height
   strip on the right, the way the OM-84 puts it under the right hand. Landscape lays the
   keys out 12 roots across x 3 rows; portrait turns the grid to 12 down x 3 across. */
:root {
  --panel: #1b1917;
  --bezel: #25221f;
  --line: #3a3530;
  --ink: #ece6da;
  --ink-dim: #9a9186;
  --key-major: #e9e2d4;
  --key-minor: #d3cbbb;
  --key-seventh: #b7ad9b;
  --key-ink: #221e1a;
  --key-shadow: #0b0a09;
  --led: #ffb23e;
  --plate: #111315;
  --plate-line: #2b2f34;
  --plate-root: #3d434a;
  --font-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --font-key: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}

html, body { height: 100%; }
html { background: var(--panel); }
body {
  background: var(--panel);
  color: var(--ink);
  font-family: var(--font-key);
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#app {
  box-sizing: border-box;
  height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(150px, 28%);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "bar plate" "keys plate";
  gap: 10px 14px;
}

/* ---------- readout ---------- */
.bar {
  grid-area: bar;
  display: flex;
  align-items: center;
  gap: 8px 10px;
  min-width: 0;
  flex-wrap: wrap;
}
.readout {
  display: flex;
  align-items: baseline;
  gap: 10px;
  background: var(--bezel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 12px;
  min-width: 0;
}
.readout .label {
  font: 500 10px/1 var(--font-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
#chordName {
  font: 400 22px/1 var(--font-display);
  color: var(--led);
  min-width: 4.5ch;
  text-shadow: 0 0 10px color-mix(in srgb, var(--led) 45%, transparent);
}
.hint {
  flex: 1 1 140px;
  font: 400 10px/1.35 var(--font-mono);
  color: var(--ink-dim);
  min-width: 0;
}
.fx { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle, .power, .transport {
  font: 600 12px/1 var(--font-key);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-dim);
  background: var(--bezel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 9px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}
.toggle::before, .power::before {
  content: "";
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line);
}
.toggle[aria-pressed="true"] { color: var(--ink); }
.toggle[aria-pressed="true"]::before { background: var(--led); box-shadow: 0 0 6px var(--led); }
.power { color: var(--key-ink); background: var(--led); border-color: var(--led); }
.power::before { background: var(--key-ink); }
.power[hidden] { display: none !important; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }

/* ---------- rhythm ---------- */
.rhythm {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.transport { color: var(--ink); min-width: 5.2em; justify-content: center; }
.transport[aria-pressed="true"] { color: var(--key-ink); background: var(--ink); border-color: var(--ink); }
.rhythm select {
  font: 600 12px/1 var(--font-key);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--bezel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 7px 8px;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
.tempo {
  flex: none;
  display: flex;
  align-items: stretch;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--bezel);
  overflow: hidden;
}
.tempo button {
  font: 500 15px/1 var(--font-mono);
  color: var(--ink);
  background: none;
  border: 0;
  padding: 0 9px;
  cursor: pointer;
}
.tempo output {
  font: 500 13px/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--led);
  min-width: 3ch;
  text-align: center;
  padding: 7px 2px;
  border-inline: 1px solid var(--line);
}
.beat {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--line);
  flex: none;
}
.beat.on { background: var(--ink-dim); }
.beat.on.one { background: var(--led); box-shadow: 0 0 8px var(--led); }
.sr {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ---------- chord keys ---------- */
.keys {
  grid-area: keys;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 6px;
  min-height: 0;
}
.key {
  position: relative;
  border: 0;
  border-radius: 6px;
  background: var(--key-major);
  color: var(--key-ink);
  box-shadow: 0 3px 0 var(--key-shadow), inset 0 -2px 0 rgb(0 0 0 / .12);
  font: 600 clamp(13px, 2.6vmin, 20px)/1 var(--font-key);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 0;
  min-width: 0;
  min-height: 0;
  cursor: pointer;
  touch-action: none;
}
.key small { font-size: .72em; font-weight: 500; }
.key.q1 { background: var(--key-minor); }
.key.q2 { background: var(--key-seventh); }
.key.down { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow), inset 0 -1px 0 rgb(0 0 0 / .12); }
.key.lit::after {
  content: "";
  position: absolute;
  top: 5px; right: 5px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--led);
  box-shadow: 0 0 6px var(--led);
}

/* ---------- strumplate ---------- */
.plate {
  grid-area: plate;
  position: relative;
  background:
    linear-gradient(90deg, rgb(255 255 255 / .03), transparent 30%, transparent 70%, rgb(255 255 255 / .03)),
    var(--plate);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex;
  flex-direction: column-reverse;
  overflow: hidden;
  touch-action: none;
  cursor: ns-resize;
}
.string {
  position: relative;
  flex: 1 1 0;
  border-top: 1px solid var(--plate-line);
  display: flex;
  align-items: center;
  padding-left: 10px;
  min-height: 0;
}
.string:last-child { border-top: 0; }
.string.root { border-top-color: var(--plate-root); }
.string .note {
  position: relative;
  font: 400 11px/1 var(--font-mono);
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
  z-index: 1;
}
.string.root .note { color: var(--ink); font-weight: 500; }
.string .glow {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--led) 70%, transparent), color-mix(in srgb, var(--led) 10%, transparent));
  opacity: 0;
  pointer-events: none;
}

/* Portrait: twelve roots down, three qualities across. */
@media (orientation: portrait) {
  #app {
    grid-template-columns: minmax(0, 1fr) minmax(120px, 36%);
  }
  .keys {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(12, minmax(0, 1fr));
    gap: 5px;
  }
  .hint { display: none; }
  #chordName { font-size: 18px; }
}

/* Small landscape phones need the height for the keys. */
@media (max-width: 720px) {
  .hint { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .key.down { transform: none; }
}
</style>

<body><!--repo-only-->

<div id="app">
  <header class="bar">
    <div class="readout" aria-live="polite">
      <span class="label">Ackord</span>
      <span id="chordName">C</span>
    </div>
    <div class="rhythm" role="group" aria-label="Rytm">
      <span class="beat" id="beatLed" aria-hidden="true"></span>
      <button class="transport" id="startStop" type="button" aria-pressed="false">Start</button>
      <label class="sr" for="pattern">Rytm</label>
      <select id="pattern">
        <option value="rock" selected>Rock</option>
        <option value="vamp">Vamp</option>
        <option value="march">Marsch</option>
        <option value="bossa">Bossa</option>
        <option value="swing">Swing</option>
        <option value="waltz">Vals</option>
      </select>
      <div class="tempo">
        <button type="button" id="tempoDown" aria-label="Långsammare">&minus;</button>
        <output id="bpm" aria-label="Tempo i slag per minut">96</output>
        <button type="button" id="tempoUp" aria-label="Snabbare">+</button>
      </div>
    </div>
    <button class="power" id="power" type="button">Slå på ljudet</button>
    <div class="fx">
      <button class="toggle" id="chordToggle" type="button" aria-pressed="true">Ackordljud</button>
      <button class="toggle" id="bassToggle" type="button" aria-pressed="true">Autobas</button>
      <button class="toggle" id="chorusToggle" type="button" aria-pressed="true">Chorus</button>
      <button class="toggle" id="reverbToggle" type="button" aria-pressed="true">Rum</button>
    </div>
    <span class="hint">Två i samma kolumn: dur+moll&nbsp;=&nbsp;dim, dur+7&nbsp;=&nbsp;maj7, moll+7&nbsp;=&nbsp;m7</span>
  </header>

  <div class="keys" id="keys" role="group" aria-label="Ackordknappar"></div>

  <div class="plate" id="plate" role="application" aria-label="Strumplatta, dra fingret över strängarna"></div>
</div>

<script>
/* =============================================================================
   DSP — ported from Source/dsp/PluckVoice.h, Ensemble.h and juce::Reverb.
   These classes must not reference anything outside themselves: their source text
   is what goes into the AudioWorklet.
   ============================================================================= */

class PluckVoice {
  constructor(sr) {
    this.sr = sr;
    this.active = false; this.attacking = false;
    this.env = 0; this.lp = 0;
    this.p1 = 0; this.p2 = 0.37; this.i1 = 0; this.i2 = 0;
    this.target = 1; this.atk = 0.01; this.decay = 0.999;
    this.g = 0.5; this.width = 0.35;
    this.string = -1; this.stamp = 0;
  }

  start(freq, vel, decay, spec, string, stamp) {
    const spread = Math.pow(2, spec.detune / 1200);
    this.i1 = freq / spread / this.sr;
    this.i2 = freq * spread / this.sr;
    // A string struck again is still moving; resetting its phase would click.
    if (!this.active) { this.p1 = 0; this.p2 = 0.37; this.lp = 0; }
    this.target = Math.min(1, Math.max(0, vel));
    this.atk = this.target / Math.max(1, this.sr * spec.attack);
    this.attacking = true;
    this.decay = decay;
    const cutoff = Math.min(14000, Math.max(800, freq * spec.filter));
    this.g = 1 - Math.exp(-2 * Math.PI * cutoff / this.sr);
    this.width = spec.width;
    this.string = string; this.stamp = stamp;
    this.active = true;
  }

  static blep(t, dt) {
    if (dt <= 0) return 0;
    if (t < dt) { t /= dt; return t + t - t * t - 1; }
    if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
    return 0;
  }

  osc(p, inc) {
    const w = this.width;
    let v = p < w ? 1 : -1;
    v += PluckVoice.blep(p, inc);
    let f = p + (1 - w); if (f >= 1) f -= 1;
    return v - PluckVoice.blep(f, inc);
  }

  process() {
    if (!this.active) return 0;
    if (this.attacking) {
      this.env += this.atk;
      if (this.env >= this.target) { this.env = this.target; this.attacking = false; }
    } else {
      this.env *= this.decay;
      if (this.env < 1e-4) { this.active = false; this.env = 0; return 0; }
    }
    const raw = (this.osc(this.p1, this.i1) + this.osc(this.p2, this.i2)) * 0.5;
    this.p1 += this.i1; if (this.p1 >= 1) this.p1 -= 1;
    this.p2 += this.i2; if (this.p2 >= 1) this.p2 -= 1;
    const g = Math.min(0.99, Math.max(0.0005, this.g * (0.35 + 0.65 * this.env)));
    this.lp += g * (raw - this.lp);
    return this.lp * this.env;
  }
}

/* The Juno-style chorus: one triangle LFO read half a cycle apart for width,
   1.2–6 ms of delay, no feedback, a 7 kHz pole on the wet path. */
class Ensemble {
  constructor(sr) {
    this.sr = sr;
    this.buf = new Float32Array(Math.floor(sr * 0.05) + 4);
    this.w = 0; this.phase = 0; this.rate = 0.5; this.mix = 0.45;
    this.lpL = 0; this.lpR = 0;
    this.lpc = 1 - Math.exp(-2 * Math.PI * 7000 / sr);
  }
  static tri(p) { p -= Math.floor(p); return 1 - Math.abs(2 * p - 1); }
  tap(ms) {
    const size = this.buf.length;
    let pos = this.w - ms * 0.001 * this.sr;
    while (pos < 0) pos += size;
    const a = pos | 0, b = (a + 1) % size, fr = pos - a;
    return this.buf[a] * (1 - fr) + this.buf[b] * fr;
  }
  process(x, out) {
    this.buf[this.w] = x;
    this.phase += this.rate / this.sr; if (this.phase >= 1) this.phase -= 1;
    const wl = this.tap(1.2 + Ensemble.tri(this.phase) * 4.8);
    const wr = this.tap(1.2 + Ensemble.tri(this.phase + 0.5) * 4.8);
    this.lpL += this.lpc * (wl - this.lpL);
    this.lpR += this.lpc * (wr - this.lpR);
    out[0] = x * (1 - this.mix) + this.lpL * this.mix;
    out[1] = x * (1 - this.mix) + this.lpR * this.mix;
    if (++this.w >= this.buf.length) this.w = 0;
  }
}

/* The accompaniment's voice, from CompVoice.h: an organ, more or less. Three
   sines at 1x, 2x and 3x, a 6 ms attack and a 130 ms release. A gate of zero
   holds until noteOff, which is what the held chord is; the rhythm's stabs give
   it a length. Phase is kept on retune so a chord change does not click. */
class CompVoice {
  constructor(sr, octave, twelfth) {
    this.sr = sr; this.second = octave; this.third = twelfth;
    this.atk = 1 / Math.max(1, sr * 0.006);
    this.rel = 1 / Math.max(1, sr * 0.130);
    this.env = 0; this.phase = 0; this.inc = 0; this.level = 0;
    this.active = false; this.holding = false; this.gate = -1;
  }
  noteOn(freq, level, gateSeconds) {
    this.inc = freq / this.sr; this.level = level;
    this.gate = gateSeconds > 0 ? Math.round(gateSeconds * this.sr) : -1;
    if (!this.active) this.phase = 0;
    this.holding = true; this.active = true;
  }
  setFrequency(freq) { this.inc = freq / this.sr; }
  noteOff() { this.holding = false; }
  process() {
    if (!this.active) return 0;
    if (this.gate > 0 && --this.gate === 0) this.holding = false;
    if (this.holding) this.env = Math.min(1, this.env + this.atk);
    else {
      this.env -= this.rel;
      if (this.env <= 0) { this.env = 0; this.active = false; return 0; }
    }
    const t = 2 * Math.PI * this.phase;
    const v = Math.sin(t) + this.second * Math.sin(2 * t) + this.third * Math.sin(3 * t);
    this.phase += this.inc; if (this.phase >= 1) this.phase -= 1;
    return v * this.env * this.level;
  }
}

/* Three drums, made rather than sampled, from DrumKit.h: a kick is a sine
   falling off a cliff, a snare is noise with a tuned thump under it, a hat is
   noise with the bottom taken out. */
class DrumKit {
  constructor(sr) {
    this.sr = sr;
    const dc = (sec) => Math.pow(0.001, 1 / Math.max(1, sr * sec));
    this.kickDecay = dc(0.28); this.kickPitchDecay = dc(0.035);
    this.snareToneDecay = dc(0.09); this.snareHissDecay = dc(0.16);
    this.hatDecay = dc(0.045);
    this.kickEnv = 0; this.kickPitchEnv = 0; this.kickPhase = 0;
    this.snareToneEnv = 0; this.snareHissEnv = 0; this.snarePhase = 0; this.snareLow = 0;
    this.hatEnv = 0; this.hatLow = 0;
    this.rng = 0x9e3779b9 | 0;
  }
  trigger(piece, level) {
    if (piece === 'kick') { this.kickEnv = level; this.kickPitchEnv = 1; }
    else if (piece === 'snare') { this.snareToneEnv = level * 0.8; this.snareHissEnv = level; }
    else this.hatEnv = level;
  }
  noise() {
    let x = this.rng;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    this.rng = x | 0;
    return this.rng / 2147483648;
  }
  process() {
    const F = 1e-4, TWO_PI = 2 * Math.PI;
    let out = 0;
    if (this.kickEnv > F) {
      // 150 Hz down to 46 in about a thirtieth of a second. The drop is the drum.
      this.kickPhase += (46 + 105 * this.kickPitchEnv) / this.sr;
      if (this.kickPhase >= 1) this.kickPhase -= 1;
      out += Math.sin(TWO_PI * this.kickPhase) * this.kickEnv;
      this.kickEnv *= this.kickDecay; this.kickPitchEnv *= this.kickPitchDecay;
    }
    const n = this.noise();
    if (this.snareHissEnv > F) {
      this.snareLow += 0.55 * (n - this.snareLow);
      out += (n - this.snareLow) * this.snareHissEnv * 0.45;
      this.snareHissEnv *= this.snareHissDecay;
    }
    if (this.snareToneEnv > F) {
      this.snarePhase += 190 / this.sr; if (this.snarePhase >= 1) this.snarePhase -= 1;
      out += Math.sin(TWO_PI * this.snarePhase) * this.snareToneEnv * 0.35;
      this.snareToneEnv *= this.snareToneDecay;
    }
    if (this.hatEnv > F) {
      this.hatLow += 0.82 * (n - this.hatLow);
      out += (n - this.hatLow) * this.hatEnv * 0.26;
      this.hatEnv *= this.hatDecay;
    }
    return out;
  }
}

/* The accompaniment, from CompEngine.h: chord, auto-bass and drums on one clock.
   Stopped, it is the Omnichord's manual mode, a chord and a root held for as long
   as a button is. Running, it plays one of the six rhythm figures on the last
   chord pressed, with the bass alternating root and fifth. */
class Comp {
  constructor(sr) {
    this.sr = sr;
    this.cv = [0, 1, 2].map(() => new CompVoice(sr, 0.42, 0.18));   // octave and twelfth: an organ
    this.bass = new CompVoice(sr, 0.30, 0.04);                      // almost pure, so it stays under
    this.drums = new DrumKit(sr);
    this.notes = [55, 59, 62]; this.root = 36; this.fifth = 43;
    this.alt = false;
    this.running = false; this.holding = false;
    this.chordOn = true; this.bassOn = true;
    this.pattern = 'rock'; this.bpm = 96;
    this.step = -1; this.counter = 0; this.spb = 1;
    this.beat = -1;
    this.updateClock();
  }

  /* Which steps each part lands on. The grid is per figure: SWING runs on
     triplets because a shuffle cannot be written in sixteenths, and VALS keeps
     sixteenths but has three beats to the bar. */
  static figure(p) {
    const at = (...s) => s.reduce((m, x) => m | (1 << x), 0);
    const hat16 = at(0, 2, 4, 6, 8, 10, 12, 14);
    const F = {
      vamp:  { bass: at(0, 8), chord: at(4, 12), kick: at(0, 8), snare: at(4, 12), hat: hat16, spb: 4, beats: 4, bg: 0.34, cg: 0.24 },
      march: { bass: at(0, 4, 8, 12), chord: at(4, 12), kick: at(0, 4, 8, 12), snare: at(4, 12), hat: hat16, spb: 4, beats: 4, bg: 0.20, cg: 0.22 },
      rock:  { bass: at(0, 3, 8, 11), chord: at(4, 12), kick: at(0, 3, 8, 11), snare: at(4, 12), hat: hat16, spb: 4, beats: 4, bg: 0.22, cg: 0.26 },
      bossa: { bass: at(0, 6, 8, 14), chord: at(2, 6, 10, 14), kick: at(0, 6, 8, 14), snare: at(3, 10), hat: hat16, spb: 4, beats: 4, bg: 0.26, cg: 0.18 },
      swing: { bass: at(0, 6), chord: at(3, 9), kick: at(0), snare: at(3, 9), hat: at(0, 2, 3, 6, 8, 9), spb: 3, beats: 4, bg: 0.28, cg: 0.20 },
      waltz: { bass: at(0), chord: at(4, 8), kick: at(0), snare: at(4, 8), hat: at(0, 2, 4, 6, 8, 10), spb: 4, beats: 3, bg: 0.30, cg: 0.22 }
    };
    return F[p] || F.rock;
  }

  static hz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  updateClock() {
    const f = Comp.figure(this.pattern);
    this.fig = f;
    this.spb = Math.max(1, Math.round(this.sr * 60 / this.bpm / f.spb));
  }

  setChord(m) {
    this.notes = m.chord; this.root = m.bass; this.fifth = m.fifth;
    this.alt = false;
    if (!this.running) { if (this.holding) this.strikeHeld(); return; }
    // A rhythm waits for its next hit before striking again, but whatever is
    // already sounding follows the chord at once rather than sitting on the old root.
    for (let i = 0; i < 3; i++) if (this.cv[i].active) this.cv[i].setFrequency(Comp.hz(this.notes[i]));
    if (this.bass.active) this.bass.setFrequency(Comp.hz(this.root));
  }

  configure(m) {
    this.chordOn = m.chordOn; this.bassOn = m.bassOn;
    if (m.bpm !== this.bpm) { this.bpm = Math.min(220, Math.max(40, m.bpm)); this.updateClock(); }
    if (m.pattern !== this.pattern) {
      this.pattern = m.pattern; this.updateClock();
      // Changing figure mid-bar restarts the bar.
      if (this.running) { this.step = -1; this.counter = 0; this.releaseAll(); }
    }
    if (m.running !== this.running) {
      this.running = m.running;
      this.step = -1; this.counter = 0;
      this.releaseAll();
      if (!this.running) this.beat = -1;
    }
    if (!this.running) { if (this.holding) this.strikeHeld(); else this.releaseAll(); }
  }

  setHold(on) {
    this.holding = on;
    if (this.running) return;
    if (on) this.strikeHeld(); else this.releaseAll();
  }

  // Sustained sits lower than struck: a held chord is present the whole time.
  strikeHeld() {
    for (let i = 0; i < 3; i++) {
      if (this.chordOn) this.cv[i].noteOn(Comp.hz(this.notes[i]), 0.15, 0);
      else this.cv[i].noteOff();
    }
    if (this.bassOn) this.bass.noteOn(Comp.hz(this.root), 0.28, 0);
    else this.bass.noteOff();
  }

  releaseAll() {
    for (const v of this.cv) v.noteOff();
    this.bass.noteOff();
  }

  fire(step) {
    const f = this.fig, hit = (mask) => ((mask >> step) & 1) !== 0;
    if (hit(f.kick)) this.drums.trigger('kick', 0.95);
    if (hit(f.snare)) this.drums.trigger('snare', 0.75);
    if (hit(f.hat)) this.drums.trigger('hat', step % 4 === 0 ? 0.55 : 0.34);
    if (this.bassOn && hit(f.bass)) {
      this.bass.noteOn(Comp.hz(this.alt ? this.fifth : this.root), 0.55, f.bg);
      this.alt = !this.alt;
    }
    if (this.chordOn && hit(f.chord))
      for (let i = 0; i < 3; i++) this.cv[i].noteOn(Comp.hz(this.notes[i]), 0.26, f.cg);
    if (step % f.spb === 0) this.beat = step / f.spb;
  }

  process() {
    if (this.running && --this.counter <= 0) {
      this.counter = this.spb;
      this.step = (this.step + 1) % (this.fig.spb * this.fig.beats);
      this.fire(this.step);
    }
    let sum = this.bass.process();
    for (let k = 0; k < 3; k++) sum += this.cv[k].process();
    // Loud enough to drive, quiet enough to stay behind the plate.
    sum += this.drums.process() * 0.55;
    return sum;
  }
}

/* Freeverb as juce::Reverb runs it, with Chordtroller's room:
   size 0.62, damping 0.42, wet 0.30, dry 1.0, width 1.0. */
class Freeverb {
  constructor(sr) {
    const scale = sr / 44100;
    const combs = [1116, 1188, 1277, 1356, 1422, 1491, 1557, 1617];
    const alls = [556, 441, 341, 225];
    const mk = (n) => ({ b: new Float32Array(Math.max(1, Math.round(n * scale))), i: 0, last: 0 });
    this.cL = combs.map((n) => mk(n));
    this.cR = combs.map((n) => mk(n + 23));
    this.aL = alls.map((n) => mk(n));
    this.aR = alls.map((n) => mk(n + 23));
    this.fb = 0.62 * 0.28 + 0.7;
    this.d1 = 0.42 * 0.4; this.d2 = 1 - this.d1;
    this.wet1 = 0.5 * (0.30 * 3) * 2; this.wet2 = 0;
    this.dry = 1.0 * 2;
    this.on = true;
  }
  comb(c, x) {
    const o = c.b[c.i];
    c.last = o * this.d2 + c.last * this.d1;
    if (Math.abs(c.last) < 1e-20) c.last = 0;
    c.b[c.i] = x + c.last * this.fb;
    if (++c.i >= c.b.length) c.i = 0;
    return o;
  }
  allpass(a, x) {
    const o = a.b[a.i];
    a.b[a.i] = x + o * 0.5;
    if (++a.i >= a.b.length) a.i = 0;
    return o - x;
  }
  process(io) {
    const l = io[0], r = io[1];
    // Fed even when switched off, so turning it back on finds a live room.
    const x = (l + r) * 0.015;
    let ol = 0, or = 0;
    for (let k = 0; k < 8; k++) { ol += this.comb(this.cL[k], x); or += this.comb(this.cR[k], x); }
    for (let k = 0; k < 4; k++) { ol = this.allpass(this.aL[k], ol); or = this.allpass(this.aR[k], or); }
    const wet = this.on ? 1 : 0;
    io[0] = wet * (ol * this.wet1 + or * this.wet2) + l * this.dry;
    io[1] = wet * (or * this.wet1 + ol * this.wet2) + r * this.dry;
  }
}

/* The instrument: a 48-voice pool, the plate's notes, and a queue of plucks
   placed on the sample they were scheduled for. */
class OmniDSP {
  constructor(sr) {
    this.sr = sr;
    this.voices = [];
    for (let i = 0; i < 48; i++) this.voices.push(new PluckVoice(sr));
    this.ens = new Ensemble(sr);
    this.verb = new Freeverb(sr);
    this.notes = [];
    this.queue = [];
    this.stamp = 0;
    this.chorus = true;
    // OMNI from VoiceSpec.h: pulse 0.35, filter x7, 2 ms attack, 3 cents apart.
    this.spec = { width: 0.35, filter: 7, attack: 0.002, detune: 3 };
    // Four seconds to -60 dB: Chordtroller's ring with LT released.
    this.decay = Math.pow(0.001, 1 / (sr * 4));
    this.frame = [0, 0];
    this.comp = new Comp(sr);
    this.lastBeat = -1;
  }

  message(m) {
    if (m.type === 'chord') this.notes = m.notes;
    else if (m.type === 'pluck') this.queue.push({ s: m.string, v: m.vel, w: Math.round(m.delay * this.sr), done: false });
    else if (m.type === 'fx') { this.chorus = m.chorus; this.verb.on = m.reverb; }
    else if (m.type === 'compChord') this.comp.setChord(m);
    else if (m.type === 'rhythm') this.comp.configure(m);
    else if (m.type === 'hold') this.comp.setHold(m.on);
  }

  /* The beat the rhythm last landed on, once per change, for the tempo light. */
  takeBeat() {
    const b = this.comp.beat;
    if (b === this.lastBeat) return -1;
    this.lastBeat = b;
    return b;
  }

  // A ringing string takes its own note back; then a free voice; then the oldest.
  alloc(s) {
    for (const v of this.voices) if (v.active && v.string === s) return v;
    for (const v of this.voices) if (!v.active) return v;
    let oldest = this.voices[0];
    for (const v of this.voices) if (v.stamp < oldest.stamp) oldest = v;
    return oldest;
  }

  trigger(s, vel) {
    const note = this.notes[s];
    if (note === undefined) return;
    const freq = 440 * Math.pow(2, (note - 69) / 12);
    this.alloc(s).start(freq, vel, this.decay, this.spec, s, ++this.stamp);
  }

  process(L, R, n) {
    const q = this.queue, fr = this.frame;
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < q.length; k++) {
        const it = q[k];
        if (!it.done && it.w <= i) { this.trigger(it.s, it.v); it.done = true; }
      }
      let sum = 0;
      for (let k = 0; k < 48; k++) { const v = this.voices[k]; if (v.active) sum += v.process(); }
      const dry = sum * 0.07;
      if (this.chorus) this.ens.process(dry, fr);
      else { this.ens.process(dry, fr); fr[0] = fr[1] = dry; }
      // The accompaniment skips the chorus, as the comp does in Chordtroller: the
      // chorus would wash the bass into mush. It meets the strings at the room.
      const comp = this.comp.process() * 0.21;
      fr[0] += comp; fr[1] += comp;
      this.verb.process(fr);
      L[i] = Math.tanh(fr[0]);
      R[i] = Math.tanh(fr[1]);
    }
    if (q.length) {
      this.queue = q.filter((it) => !it.done);
      for (const it of this.queue) it.w -= n;
    }
  }
}

/* =============================================================================
   Music — ported from Source/music/ChordRing.h (StringSet).
   ============================================================================= */

const PC_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const PC_SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

const QUALITIES = {
  maj:  { suffix: '',     third: 4, colour: 7 },
  min:  { suffix: 'm',    third: 3, colour: 7 },
  dim:  { suffix: 'dim',  third: 3, colour: 6 },
  dom7: { suffix: '7',    third: 4, colour: 10 },
  maj7: { suffix: 'maj7', third: 4, colour: 11 },
  min7: { suffix: 'm7',   third: 3, colour: 10 }
};

/* The plate, in the order the plate gives it: root, third, then the colour tone
   dropped an octave below the root, four times over, and a closing root. The
   sweep rolls instead of climbing. See the comment over StringSet in ChordRing.h. */
function buildStrings(pc, quality) {
  const q = QUALITIES[quality];
  const base = pc <= 5 ? 48 + pc : 36 + pc;
  const colourOffset = (base + q.colour - 12) >= 42 ? q.colour - 12 : q.colour;
  const out = [];
  for (let oct = 0; oct < 4; oct++) {
    const root = base + 12 * oct;
    out.push(root, root + q.third, root + colourOffset);
  }
  out.push(base + 48);
  return out;
}

// Sharps on the plate when the key says F#, C# or G#, so the two agree.
const noteName = (m, sharps) => (sharps ? PC_SHARPS : PC_NAMES)[m % 12] + (Math.floor(m / 12) - 1);

/* The OM-84's button order: twelve roots in fifths, Eb at the left. */
const ROOTS = [['Eb', 3], ['Bb', 10], ['F', 5], ['C', 0], ['G', 7], ['D', 2],
               ['A', 9], ['E', 4], ['B', 11], ['F#', 6], ['C#', 1], ['G#', 8]];
const ROWS = [{ cls: 'q0', suffix: '', name: 'dur' },
              { cls: 'q1', suffix: 'm', name: 'moll' },
              { cls: 'q2', suffix: '7', name: 'sept' }];

/* =============================================================================
   Audio plumbing
   ============================================================================= */

let ctx = null, node = null, dsp = null, ready = false;
const pending = [];
const fx = { chorus: true, reverb: true, chord: true, bass: true };
const rhythm = { running: false, pattern: 'rock', bpm: 96 };
let current = { r: 3, quality: 'maj', notes: buildStrings(0, 'maj') };

function send(m) {
  if (!ready) { if (m.type !== 'pluck') pending.push(m); return; }
  if (node && node.port) node.port.postMessage(m); else if (dsp) dsp.message(m);
}

function workletSource() {
  return [PluckVoice, Ensemble, CompVoice, DrumKit, Comp, Freeverb, OmniDSP].map((c) => c.toString()).join('\n') + `
class OmniProcessor extends AudioWorkletProcessor {
  constructor() { super(); this.dsp = new OmniDSP(sampleRate); this.port.onmessage = (e) => this.dsp.message(e.data); }
  process(inputs, outputs) {
    const o = outputs[0];
    this.dsp.process(o[0], o[1] || new Float32Array(o[0].length), o[0].length);
    const b = this.dsp.takeBeat();
    if (b >= 0) this.port.postMessage({ type: 'beat', beat: b });
    return true;
  }
}
registerProcessor('omni', OmniProcessor);`;
}

async function startAudio() {
  if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({ latencyHint: 'interactive' });
  ctx.resume();
  // Older iOS only unlocks output once a buffer has actually played.
  const unlock = ctx.createBufferSource();
  unlock.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
  unlock.connect(ctx.destination); unlock.start(0);

  try {
    const url = URL.createObjectURL(new Blob([workletSource()], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, 'omni', { numberOfInputs: 0, outputChannelCount: [2] });
    node.port.onmessage = (e) => { if (e.data.type === 'beat') showBeat(e.data.beat); };
  } catch (e) {
    // No worklet (or it was blocked): run the same DSP on the main thread.
    dsp = new OmniDSP(ctx.sampleRate);
    node = ctx.createScriptProcessor(512, 0, 2);
    node.onaudioprocess = (ev) => {
      const b = ev.outputBuffer;
      dsp.process(b.getChannelData(0), b.getChannelData(1), b.length);
      const beat = dsp.takeBeat();
      if (beat >= 0) showBeat(beat);
    };
  }
  node.connect(ctx.destination);
  ready = true;
  send({ type: 'chord', notes: current.notes });
  send({ type: 'fx', chorus: fx.chorus, reverb: fx.reverb });
  pending.length = 0;
  sendCompChord();
  sendRhythm();
  updateChordSound();
  ctx.onstatechange = updatePower;
  updatePower();
}

const powerBtn = document.getElementById('power');
function updatePower() { powerBtn.hidden = !!ctx && ctx.state === 'running'; }
powerBtn.addEventListener('click', startAudio);
// Touch only counts as a user gesture on release, so unlock there.
document.addEventListener('pointerup', () => { if (!ctx || ctx.state !== 'running') startAudio(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && ctx.state !== 'running') ctx.resume(); });

for (const [id, key] of [['chordToggle', 'chord'], ['bassToggle', 'bass'], ['chorusToggle', 'chorus'], ['reverbToggle', 'reverb']]) {
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    fx[key] = !fx[key];
    b.setAttribute('aria-pressed', String(fx[key]));
    if (key === 'chord' || key === 'bass') sendRhythm();
    else send({ type: 'fx', chorus: fx.chorus, reverb: fx.reverb });
  });
}

/* ---------- rhythm ---------- */

function sendRhythm() {
  send({ type: 'rhythm', running: rhythm.running, pattern: rhythm.pattern, bpm: rhythm.bpm,
         chordOn: fx.chord, bassOn: fx.bass });
}

const startBtn = document.getElementById('startStop');
const patternSel = document.getElementById('pattern');
const bpmOut = document.getElementById('bpm');
const beatLed = document.getElementById('beatLed');

startBtn.addEventListener('click', () => {
  rhythm.running = !rhythm.running;
  startBtn.setAttribute('aria-pressed', String(rhythm.running));
  startBtn.textContent = rhythm.running ? 'Stopp' : 'Start';
  sendRhythm();
  if (!rhythm.running) beatLed.classList.remove('on', 'one');
});
patternSel.addEventListener('change', () => { rhythm.pattern = patternSel.value; sendRhythm(); });
function nudgeTempo(d) {
  rhythm.bpm = Math.min(220, Math.max(40, rhythm.bpm + d));
  bpmOut.textContent = rhythm.bpm;
  sendRhythm();
}
document.getElementById('tempoDown').addEventListener('click', () => nudgeTempo(-4));
document.getElementById('tempoUp').addEventListener('click', () => nudgeTempo(4));

let beatTimer = 0;
function showBeat(b) {
  if (!rhythm.running) return;
  beatLed.classList.add('on');
  beatLed.classList.toggle('one', b === 0);
  clearTimeout(beatTimer);
  beatTimer = setTimeout(() => beatLed.classList.remove('on', 'one'), 90);
}

/* =============================================================================
   Chord keys
   ============================================================================= */

const keysEl = document.getElementById('keys');
const chordNameEl = document.getElementById('chordName');
const keyEls = [];

ROOTS.forEach(([label], r) => {
  ROWS.forEach((row, q) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key ' + row.cls;
    b.dataset.r = r; b.dataset.q = q;
    b.setAttribute('aria-label', label + ' ' + row.name);
    b.innerHTML = label + (row.suffix ? '<small>' + row.suffix + '</small>' : '');
    keysEl.appendChild(b);
    keyEls.push(b);
  });
});

const portraitQuery = window.matchMedia('(orientation: portrait)');
function layoutKeys() {
  const portrait = portraitQuery.matches;
  for (const b of keyEls) {
    const r = +b.dataset.r, q = +b.dataset.q;
    b.style.gridColumn = String(portrait ? q + 1 : r + 1);
    b.style.gridRow = String(portrait ? r + 1 : q + 1);
  }
}
layoutKeys();
portraitQuery.addEventListener ? portraitQuery.addEventListener('change', layoutKeys) : portraitQuery.addListener(layoutKeys);

const held = new Map();   // pointerId -> key element

/* Buttons held together in one column combine, the way the OM-84 does it.
   Releasing never changes the chord: the plate keeps the last one played. */
function qualityFrom(rows) {
  const maj = rows.has(0), min = rows.has(1), sev = rows.has(2);
  if (maj && min) return 'dim';
  if (maj && sev) return 'maj7';
  if (min && sev) return 'min7';
  if (min) return 'min';
  if (sev) return 'dom7';
  return 'maj';
}

function selectChord(r) {
  const rows = new Set();
  for (const b of held.values()) if (+b.dataset.r === r) rows.add(+b.dataset.q);
  if (rows.size === 0) rows.add(0);
  const quality = qualityFrom(rows);
  const pc = ROOTS[r][1];
  current = { r, quality, notes: buildStrings(pc, quality), rows };
  send({ type: 'chord', notes: current.notes });
  chordNameEl.textContent = ROOTS[r][0] + QUALITIES[quality].suffix;
  for (const b of keyEls) b.classList.toggle('lit', +b.dataset.r === r && rows.has(+b.dataset.q));
  renderPlate();
  sendCompChord();
  updateChordSound();
}

/* CompEngine's voicing: close root position just under the middle of the plate,
   with sevenths dropping the fifth exactly as the plate does. The bass sits in
   the second octave, where nothing the plate does can reach. */
function chordVoicing(pc, quality) {
  const q = QUALITIES[quality];
  const base = 55 + ((((pc - 55) % 12) + 12) % 12);
  return { chord: [base, base + q.third, base + q.colour], bass: 36 + pc, fifth: 36 + (pc + 7) % 12 };
}

function sendCompChord() {
  send({ type: 'compChord', ...chordVoicing(ROOTS[current.r][1], current.quality) });
}

/* Stopped, the chord section sounds while a chord button is held, the way the
   OM-84's does. Running, the rhythm plays the last chord pressed and the hold
   does nothing. ACKORDLJUD and AUTOBAS switch each half off in both modes. */
let holding = false;
function updateChordSound() {
  const want = held.size > 0;
  if (want !== holding) { holding = want; send({ type: 'hold', on: want }); }
}

keysEl.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.key');
  if (!b) return;
  e.preventDefault();
  held.set(e.pointerId, b);
  b.classList.add('down');
  selectChord(+b.dataset.r);
});
function releaseKey(e) {
  const b = held.get(e.pointerId);
  if (!b) return;
  held.delete(e.pointerId);
  b.classList.remove('down');
  updateChordSound();
}
document.addEventListener('pointerup', releaseKey);
document.addEventListener('pointercancel', releaseKey);

/* =============================================================================
   Strumplate
   ============================================================================= */

const plateEl = document.getElementById('plate');
const STRINGS = 13;
const stringEls = [];
for (let i = 0; i < STRINGS; i++) {
  const s = document.createElement('div');
  s.className = 'string';
  s.innerHTML = '<span class="glow"></span><span class="note"></span>';
  plateEl.appendChild(s);   // column-reverse: string 0 sits at the bottom
  stringEls.push(s);
}

function renderPlate() {
  current.notes.forEach((m, i) => {
    const el = stringEls[i];
    el.querySelector('.note').textContent = noteName(m, ROOTS[current.r][0].includes('#'));
    el.classList.toggle('root', i % 3 === 0);
  });
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flash(i, vel) {
  const g = stringEls[i].firstChild;
  if (g.animate) g.animate([{ opacity: 0.35 + 0.65 * vel }, { opacity: 0 }],
                           { duration: reduceMotion ? 180 : 700, easing: 'cubic-bezier(.2,.7,.3,1)' });
}

function pluck(i, vel, delay) {
  send({ type: 'pluck', string: i, vel, delay });
  flash(i, vel);
}

/* Position on the plate, in strings, with string 0 at the bottom. */
function plateCoord(clientY) {
  const r = plateEl.getBoundingClientRect();
  const f = 1 - (clientY - r.top) / r.height;
  return Math.min(STRINGS - 0.0001, Math.max(0, f * STRINGS));
}

/* A finger resting on a line must not chatter, so it has to cross a little past
   the line before the next string counts. Same idea as the stick's sector hysteresis. */
const HYST = 0.18;
const fingers = new Map();   // pointerId -> { idx, t }

plateEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { plateEl.setPointerCapture(e.pointerId); } catch (err) {}
  const idx = Math.floor(plateCoord(e.clientY));
  fingers.set(e.pointerId, { idx, t: e.timeStamp });
  pluck(idx, 0.9, 0);
});

plateEl.addEventListener('pointermove', (e) => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const pos = plateCoord(e.clientY);
  if (pos >= f.idx - HYST && pos < f.idx + 1 + HYST) return;
  const next = Math.floor(pos);
  const dir = next > f.idx ? 1 : -1;
  const n = Math.abs(next - f.idx);
  const dt = Math.max(1, e.timeStamp - f.t);
  // A fast sweep plucks lighter, as in strumVelocity().
  const speed = n / (dt / 1000);
  const vel = Math.min(1, Math.max(0.3, 1 - 0.35 * Math.min(1, speed / 40)));
  // Strings crossed within one move event are spread over the time it covered.
  const span = Math.min(dt, 30) / 1000;
  for (let k = 1; k <= n; k++) pluck(f.idx + dir * k, vel, span * (k - 1) / n);
  f.idx = next; f.t = e.timeStamp;
});

function liftFinger(e) { fingers.delete(e.pointerId); }
plateEl.addEventListener('pointerup', liftFinger);
plateEl.addEventListener('pointercancel', liftFinger);

// iOS still scrolls and zooms on touchmove unless it is cancelled outright.
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// Open on C major, the way the instrument wakes up.
selectChord(3);
</script>
