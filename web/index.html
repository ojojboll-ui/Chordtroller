let ctx = null, node = null, dsp = null, ready = false;
const fx = { chorus: true, reverb: true, chord: false, bass: false };
const rhythm = { pattern: 'rock', bpm: 96 };
const transport = { playing: false, metronome: false };
let inst = 'omni';
const junoState = { genre: 0, patch: 0, chorus: 1, bass: true, ext: false, hold: false, cutoff: 0.6, resonance: 0.15 };
let phrase = null;   // { style, variation } under the finger, or held
/* Each tab plays its own chord: the Omni's keys and the Juno's keys are two parts. */
/* A chord is a root (pitch class), a quality, and how the root is spelled on
   the keys it came from. */
function makeChord(pc, quality, label) { return { pc, quality, label: label || rootName(pc), notes: buildStrings(pc, quality) }; }
const chordState = { omni: makeChord(0, 'maj'), juno: makeChord(0, 'maj') };
let current = chordState.omni;

const earlyPlucks = [];   // the touch that starts the sound is heard too
function send(m) {
  if (!ready) { if (m.type === 'pluck') earlyPlucks.push({ m, t: performance.now() }); return; }
  if (node && node.port) node.port.postMessage(m); else if (dsp) dsp.message(m);
}

function workletSource() {
  return [PluckVoice, Ensemble, CompVoice, Comp, Freeverb, JunoVoice, TempoDelay, JunoEngine, AcidVoice, AcidEngine, Svf, PumpKit, OmniDSP].map((c) => c.toString()).join('\n') + `
class OmniProcessor extends AudioWorkletProcessor {
  constructor() { super(); this.dsp = new OmniDSP(sampleRate); this.port.onmessage = (e) => this.dsp.message(e.data); }
  process(inputs, outputs) {
    const o = outputs[0];
    this.dsp.process(o[0], o[1] || new Float32Array(o[0].length), o[0].length);
    const out = this.dsp.outbox;
    for (let i = 0; i < out.length; i++) this.port.postMessage(out[i]);
    out.length = 0;

// Older iOS only unlocks output once a buffer has actually played.
function playSilence() {
  const b = ctx.createBufferSource();
  b.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
  b.connect(ctx.destination); b.start(0);
}

async function startAudio() {
  if (ctx) { if (ctx.state !== 'running') { ctx.resume(); playSilence(); } return; }
  try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({ latencyHint: 'interactive' });
  ctx.resume();
  playSilence();

  try {
    const url = URL.createObjectURL(new Blob([workletSource()], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, 'omni', { numberOfInputs: 0, outputChannelCount: [2] });
    node.port.onmessage = (e) => onDsp(e.data);
  } catch (e) {
    // No worklet (or it was blocked): run the same DSP on the main thread.
    dsp = new OmniDSP(ctx.sampleRate);
    node = ctx.createScriptProcessor(512, 0, 2);
    node.onaudioprocess = (ev) => {
      const b = ev.outputBuffer;
      dsp.process(b.getChannelData(0), b.getChannelData(1), b.length);
      for (const msg of dsp.outbox) onDsp(msg);
      dsp.outbox.length = 0;
    };
  }
  node.connect(ctx.destination);
  ready = true;
  send({ type: 'chord', notes: chordState.omni.notes });
  send({ type: 'fx', chorus: fx.chorus, reverb: fx.reverb });
  sendCompChord();
  sendRhythm();
  sendVoiceSpec();
  sounds.juno.forEach((_, i) => sendJunoPatch(i));
  sendOmniFx();
  sendAcidParams();
  sendAcidPattern();
  sendDrumPattern();
  sendDrumParams();
  MIX_CHANNELS.forEach(([ch]) => sendMixer(ch));
  send({ type: 'transport', playing: transport.playing, bpm: rhythm.bpm });
  send({ type: 'metronome', on: transport.metronome });
  sendJunoParams();
  sendJunoChord();
  if (loopUI.events.length) send({ type: 'loopLoad', events: loopUI.events, bars: loopUI.bars, state: loopUI.state });
  else send({ type: 'loopBars', bars: loopUI.bars });
  updateChordSound();
  const now = performance.now();
  for (const p of earlyPlucks) if (now - p.t < 500) send(p.m);
  earlyPlucks.length = 0;
}

// Sound starts with the first touch anywhere. iOS only counts a touch as a
// user gesture when it ends, and not as a pointerup when the plate or the keys
// have taken the touch (they cancel its default), so touchend and click are
// listened to as well, before anything else sees them.
const unlockAudio = () => { if (!ctx || ctx.state !== 'running') startAudio(); };
for (const type of ['touchend', 'pointerup', 'click', 'keydown'])
  document.addEventListener(type, unlockAudio, { capture: true, passive: true });

/* Everything the audio thread reports back. */
function onDsp(m) {
  if (m.type === 'tick') onTick(m);
  else if (m.type === 'loop') onLoop(m);
  else if (m.type === 'loopEvent') onLoopEvent(m.e);
}

function onTick(m) {

    beatLed.classList.remove('on', 'one');

/* A fader is a strip: the finger's position along it is the value. */
const mainFaderShows = [];
function refreshMainFaders() { mainFaderShows.forEach((f) => f()); }
function makeFader(id, key, target = () => junoState, after = sendJunoParams) {
  const el = document.getElementById(id);
  const fill = el.querySelector('.fill'), val = el.querySelector('.fval');
  const show = () => {
    const pct = Math.round(target()[key] * 100);
    fill.style.width = pct + '%';
    val.textContent = pct;
    el.setAttribute('aria-valuenow', String(pct));
  };
  mainFaderShows.push(show);
  const setFrom = (x) => {
    const r = el.getBoundingClientRect();
    target()[key] = Math.min(1, Math.max(0, (x - r.left) / r.width));
    show(); after();
  };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.dataset.drag = e.pointerId;
    setFrom(e.clientX);
  });
  el.addEventListener('pointermove', (e) => { if (el.dataset.drag == e.pointerId) setFrom(e.clientX); });
  const end = () => { delete el.dataset.drag; };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 0.02, ArrowUp: 0.02, ArrowLeft: -0.02, ArrowDown: -0.02 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    target()[key] = Math.min(1, Math.max(0, target()[key] + d));
    show(); after();
  });
  show();
}

  el.tabIndex = 0;
  el.setAttribute('aria-label', item.label);
  el.innerHTML = '<span class="fill"></span><span class="flabel"></span><span class="fval"></span>';
  el.querySelector('.flabel').textContent = item.label;
  const fill = el.querySelector('.fill'), val = el.querySelector('.fval');
  const toNorm = (v) => item.log ? Math.log(v / item.min) / Math.log(item.max / item.min) : (v - item.min) / (item.max - item.min);
  const fromNorm = (t) => item.log ? item.min * Math.pow(item.max / item.min, t) : item.min + t * (item.max - item.min);
  const clamp01 = (t) => Math.min(1, Math.max(0, t));
  const show = () => {
    const v = targetOf(item)[item.key];
    fill.style.width = (clamp01(toNorm(v)) * 100) + '%';
    val.textContent = item.fmt(v);
    el.setAttribute('aria-valuetext', item.fmt(v));
  };
  const setNorm = (t) => { targetOf(item)[item.key] = fromNorm(clamp01(t)); show(); commit(item); };
  let drag = null;
  el.addEventListener('pointerdown', (e) => {
    drag = { id: e.pointerId, x: e.clientX, t: clamp01(toNorm(targetOf(item)[item.key])), moving: false };
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    const dx = e.clientX - drag.x;
    if (!drag.moving) {
      if (Math.abs(dx) < 6) return;
      drag.moving = true;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    setNorm(drag.t + dx / el.getBoundingClientRect().width);
  });
  const end = () => { drag = null; };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 0.02, ArrowUp: 0.02, ArrowLeft: -0.02, ArrowDown: -0.02 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    setNorm(clamp01(toNorm(targetOf(item)[item.key])) + d);
  });
  show();
  return el;
}

function editChoice(item) {
  const row = document.createElement('div');
  row.className = 'seg-row';
  row.innerHTML = '<span class="flabel"></span><div class="seg" role="group"></div>';
  row.querySelector('.flabel').textContent = item.label;
  const seg = row.querySelector('.seg');
  seg.setAttribute('aria-label', item.label);
  for (const [value, label] of item.options) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(targetOf(item)[item.key] === value));
    b.addEventListener('click', () => {
      const t = targetOf(item);
      t[item.key] = value;
      // Harpa and vibrafon carry no pulse width; a pulse needs one to sound.
      if (item.key === 'wave' && value === 'pulse' && !(t.width >= 0.05)) t.width = 0.35;
      commit(item);
      renderEditor();   // a choice can show or hide other controls
    });
    seg.appendChild(b);
  }
  return row;
}

const appEl = document.getElementById('app');
const editorEl = document.getElementById('editor');
const edBody = document.getElementById('edBody');
const edName = document.getElementById('edName');
const resetRow = document.querySelector('.ed-resets');

function renderEditor() {
  const sound = soundBeingEdited();
  document.getElementById('resetSound').hidden = !!sound.user;
  document.getElementById('deleteSound').hidden = !sound.user;
  arm(deleteBtn, false);
  edName.textContent = ({ omni: 'Omni · ', juno: 'Juno · ', acid: '303 · ' })[inst] + title(sound.name);
  const scroll = edBody.scrollTop;
  edBody.textContent = '';
  for (const g of EDIT[inst]) {
    if (g.custom) { edBody.appendChild(g.custom()); continue; }
    const sec = document.createElement('div');
    sec.className = 'ed-group';
    const h = document.createElement('h3');
    h.textContent = g.group;
    if (g.fx) { const t = document.createElement('span'); t.className = 'fxtag'; t.textContent = 'Effect'; h.appendChild(t); }
    sec.appendChild(h);
    for (const item of g.items) {
      if (item.when && !item.when(sound)) continue;
      sec.appendChild(item.kind === 'choice' ? editChoice(item) : editFader(item));
    }
    edBody.appendChild(sec);
  }
  edBody.appendChild(resetRow);   // last, after the effects
  resetRow.hidden = false;
  edBody.scrollTop = scroll;
}

function openEditor() {
  appEl.classList.add('editing');
  editorEl.hidden = false;
  renderEditor();
}
function closeEditor() {
  appEl.classList.remove('editing');
  editorEl.hidden = true;
}
document.getElementById('editBtn').addEventListener('click', openEditor);
document.getElementById('edDone').addEventListener('click', closeEditor);

/* ---------- presets ---------- */

const saveForm = document.getElementById('saveForm');
const nameInput = document.getElementById('presetName');

let saveWhat = 'sound';
function openSave(what) {
  saveWhat = what;
  saveForm.hidden = false;
  const list = what === 'pattern' ? acidPatterns : sounds[inst];
  const own = list.filter((x) => x.user).length;
  nameInput.value = (what === 'pattern' ? 'Pattern ' : 'User ') + (own + 1);
  nameInput.focus();
  nameInput.select();
}
document.getElementById('saveAs').addEventListener('click', () => {
  openSave('sound');
  return;
  nameInput.focus();
  nameInput.select();
});
document.getElementById('saveCancel').addEventListener('click', () => { saveForm.hidden = true; });

/* The sound as it is now becomes a new sound of the user's own, and is selected. */
saveForm.addEventListener('submit', (e) => {
  e.preventDefault();
  if (saveWhat === 'pattern') {
    const fresh = clone(currentPattern());
    fresh.name = (nameInput.value.trim() || 'Pattern').toUpperCase().slice(0, 16);
    fresh.user = true;
    acidPatterns.push(fresh);
    rebuildSoundMenus();
    acidPatternSel.value = String(acidPatterns.length - 1);
    sendAcidPattern(); renderSeq(); renderReadout();
    saveForm.hidden = true; nameInput.blur();
    save(); renderEditor();
    return;
  }
  const fresh = clone(soundBeingEdited());
  fresh.name = (nameInput.value.trim() || 'User').toUpperCase().slice(0, 16);
  fresh.user = true;
  sounds[inst].push(fresh);

  rebuildSoundMenus();
  if (inst === 'omni') { voiceSel.value = String(i); sendVoiceSpec(); }
  else if (inst === 'acid') { acidSoundSel.value = String(i); sendAcidParams(); refreshMainFaders(); }
  else { patchSel.value = String(i); junoState.patch = i; sendJunoPatch(i); sendJunoParams(); }
  saveForm.hidden = true;
  nameInput.blur();
  save();
  renderEditor();
});

/* Deleting asks twice, on the button itself: the page cannot show a dialog. */
const deleteBtn = document.getElementById('deleteSound');
let armTimer = 0;
function arm(btn, on) {
  clearTimeout(armTimer);
  if (!btn.dataset.idle) btn.dataset.idle = btn.textContent;
  btn.dataset.armed = on ? '1' : '';
  btn.textContent = on ? 'Tap again' : btn.dataset.idle;
  if (on) armTimer = setTimeout(() => arm(btn, false), 3000);
}
deleteBtn.addEventListener('click', () => {
  if (!deleteBtn.dataset.armed) { arm(deleteBtn, true); return; }
  arm(deleteBtn, false);
  const i = inst === 'omni' ? +voiceSel.value : inst === 'acid' ? +acidSoundSel.value : junoState.patch;
  if (!sounds[inst][i] || !sounds[inst][i].user) return;
  sounds[inst].splice(i, 1);
  ({ omni: voiceSel, juno: patchSel, acid: acidSoundSel })[inst].value = '0';
  rebuildSoundMenus();
  if (inst === 'omni') sendVoiceSpec();
  else if (inst === 'acid') { sendAcidParams(); refreshMainFaders(); }
  else {
    // Everything after the deleted sound moved down one place.
    junoState.patch = 0;
    sounds.juno.forEach((_, k) => sendJunoPatch(k));
    sendJunoParams();
  }
  save();
  renderEditor();
});

document.getElementById('resetSound').addEventListener('click', () => {
  const i = inst === 'omni' ? +voiceSel.value : inst === 'acid' ? +acidSoundSel.value : junoState.patch;
  const fresh = clone(FACTORY[inst][i]);
  // Delay belongs to the Juno patch but lives under effects, so it stays put here.
  if (inst === 'juno') for (const k of ['delaySend', 'delayFeedback', 'delayDivision']) fresh[k] = sounds.juno[i][k];
  Object.assign(sounds[inst][i], fresh);
  if (inst === 'juno') { junoState.cutoff = 0.6; junoState.resonance = 0.15; sendJunoParams(); refreshMainFaders(); }
  if (inst === 'acid') refreshMainFaders();
  commit({});
  renderEditor();
});

document.getElementById('resetFx').addEventListener('click', () => {
  Object.assign(fxState, clone(FACTORY.fx));
  sendOmniFx();
  if (inst === 'acid') {
    const i = +acidSoundSel.value;
    for (const k of ['mix', 'echo', 'division']) sounds.acid[i][k] = (FACTORY.acid[i] || FACTORY.acid[0])[k];
    acidState.pump = 0.55;
    sendAcidParams(); refreshMainFaders();
  }
  if (inst === 'juno') {
    const i = junoState.patch;
    for (const k of ['delaySend', 'delayFeedback', 'delayDivision']) sounds.juno[i][k] = FACTORY.juno[i][k];
    sendJunoPatch(i);
    junoState.chorus = FACTORY.junoChorus;
    sendJunoParams();
  }
  save();
  renderEditor();
});

/* =============================================================================
   Chord keys
   ============================================================================= */

const keysEl = document.getElementById('keys');
const chordNameEl = document.getElementById('chordName');
const keyEls = [];

const layout = { kind: 'fifths', tonic: 0, map: null };
const QUALITY_NAMES = { maj: 'major', min: 'minor', dim: 'diminished', dom7: 'seventh', maj7: 'major seventh', min7: 'minor seventh' };
function buildKeys() {
  layout.map = buildLayout(layout.kind, layout.tonic);
  keysEl.textContent = '';
  keyEls.length = 0;
  keysEl.style.gridTemplateColumns = 'repeat(' + layout.map.cols + ', minmax(0, 1fr))';
  for (const c of layout.map.cells) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key ' + c.cls;
    b.cell = c;
    b.dataset.col = c.col; b.dataset.row = c.row;
    b.style.gridColumn = String(c.col + 1);
    b.style.gridRow = String(c.row + 1);
    const suffix = QUALITIES[c.q].suffix;
    b.setAttribute('aria-label', c.label + ' ' + QUALITY_NAMES[c.q] + (c.deg ? ', ' + c.deg : ''));
    b.innerHTML = (c.deg ? '<span class="deg">' + c.deg + '</span>' : '') + c.label + (suffix ? '<small>' + suffix + '</small>' : '');
    keysEl.appendChild(b);
    keyEls.push(b);
  }
  renderKeys();
}

const held = new Map();   // pointerId -> key element

/* Buttons held together in one column combine, the way the OM-84 does it.
   Releasing never changes the chord: the plate keeps the last one played. */
function qualityFrom(rows) {
  const maj = rows.has(0), min = rows.has(1), sev = rows.has(2);
  if (maj && min) return 'dim';
  if (maj && sev) return 'maj7';
  if (min && sev) return 'min7';
  if (min) return 'min';
  if (sev) return 'dom7';
  return 'maj';
}

function selectChord(key) {
  const c = key.cell;
  let quality = c.q;
  if (layout.map.combo) {
    const rows = new Set();
    for (const b of held.values()) if (b.cell.col === c.col) rows.add(b.cell.row);
    if (rows.size === 0) rows.add(c.row);
    quality = qualityFrom(rows);
  }
  setChord(c.pc, quality, c.label);
}

function setChord(pc, quality, label) {
  const part = inst === 'juno' ? 'juno' : 'omni';
  current = chordState[part] = makeChord(pc, quality, label);
  if (part === 'juno') sendJunoChord();
  else {
    send({ type: 'chord', notes: current.notes });
    renderPlate();
    sendCompChord();
  }
  renderKeys();
  renderReadout();
  updateChordSound();
}

/* A chord lights the buttons that make it: in fifths and chromatic, both
   buttons of a combination. */
function renderKeys() {
  const rows = ROWS_OF[current.quality] || [0];
  for (const b of keyEls) {
    const c = b.cell;
    b.classList.toggle('lit', c.pc === current.pc &&
      (layout.map.combo ? rows.includes(c.row) : c.q === current.quality));
  }
}

/* The Juno reads the keys as functions, the way Chordtroller's ring hands over
   its seventh bank: major, minor, dominant, half-diminished. dur+7 and moll+7
   reach for the genre's extended colour, as LB does; EXTENDED does it for all. */
const JUNO_FUNCTION = { maj: [0, false], min: [1, false], dom7: [2, false], dim: [3, false],
                        maj7: [0, true], min7: [1, true] };
function junoChord() {
  const c = chordState.juno, [func, combo] = JUNO_FUNCTION[c.quality];
  return { root: c.pc, func, ext: combo || junoState.ext, genre: junoState.genre, r: c.pc, quality: c.quality };
}
function sendJunoChord() { send({ type: 'junoChord', ...junoChord() }); }

const subNameEl = document.getElementById('subName');
function renderReadout() {
  document.getElementById('readLabel').textContent = inst === 'acid' ? 'Key' : 'Chord';
  if (inst === 'acid') {
    chordNameEl.textContent = PC_NAMES[acidState.key];
    subNameEl.textContent = ACID_SCALES[acidState.scale].name + ' · ' + title(currentPattern().name);
    return;
  }
  if (inst === 'juno') {
    const c = junoChord();
    chordNameEl.textContent = chordState.juno.label + JunoEngine.shape(c.genre, c.func, c.ext)[0];
    subNameEl.textContent = phrase
      ? JunoEngine.styles()[phrase.style].name + ' · ' + JunoEngine.styles()[phrase.style].v[phrase.variation].name
      : 'Hold on the plate';
  } else {
    chordNameEl.textContent = chordState.omni.label + QUALITIES[chordState.omni.quality].suffix;
    subNameEl.textContent = '';
  }
}

/* CompEngine's voicing: close root position just under the middle of the plate,
   with sevenths dropping the fifth exactly as the plate does. The bass sits in
   the second octave, where nothing the plate does can reach. */
function chordVoicing(pc, quality) {
  const q = QUALITIES[quality];
  const base = 55 + ((((pc - 55) % 12) + 12) % 12);
  return { chord: [base, base + q.third, base + q.colour], bass: 36 + pc, fifth: 36 + (pc + 7) % 12 };
}

function sendCompChord() {
  send({ type: 'compChord', ...chordVoicing(chordState.omni.pc, chordState.omni.quality) });
}

/* Stopped, the chord section sounds while a chord button is held, the way the
   OM-84's does. Running, the rhythm plays the last chord pressed and the hold
   does nothing. CHORDS and AUTO BASS switch each half off in both modes. */
let holding = false;
function updateChordSound() {
  const want = held.size > 0 && inst === 'omni';
  if (want !== holding) { holding = want; send({ type: 'hold', on: want }); }
}

keysEl.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.key');
  if (!b) return;
  e.preventDefault();
  held.set(e.pointerId, b);
  b.classList.add('down');
  selectChord(b);
});
function releaseKey(e) {
  const b = held.get(e.pointerId);
  if (!b) return;
  held.delete(e.pointerId);
  b.classList.remove('down');
  updateChordSound();
}
document.addEventListener('pointerup', releaseKey);
document.addEventListener('pointercancel', releaseKey);

/* =============================================================================
   Strumplate
   ============================================================================= */

const plateEl = document.getElementById('plate');
const STRINGS = 13;
const stringEls = [];
for (let i = 0; i < STRINGS; i++) {
  const s = document.createElement('div');
  s.className = 'string';
  s.innerHTML = '<span class="glow"></span><span class="note"></span>';
  plateEl.appendChild(s);   // column-reverse: string 0 sits at the bottom
  stringEls.push(s);
}

// Spell the plate's notes the way the chord's key would: sharps from G major
// and E minor round to C#, flats the other way.
function sharpChord(c) {
  if (c.label.includes('#')) return true;
  if (c.label.includes('b')) return false;
  const minor = c.quality === 'min' || c.quality === 'min7' || c.quality === 'dim';
  return (minor ? [4, 11, 6, 1, 8] : [7, 2, 9, 4, 11, 6, 1, 8]).includes(c.pc);
}

function renderPlate() {
  const c = chordState.omni;
  c.notes.forEach((m, i) => {
    const el = stringEls[i];
    el.querySelector('.note').textContent = noteName(m, sharpChord(c));
    el.classList.toggle('root', i % 3 === 0);
  });
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flash(i, vel) {
  const g = stringEls[i].firstChild;
  if (g.animate) g.animate([{ opacity: 0.35 + 0.65 * vel }, { opacity: 0 }],
                           { duration: reduceMotion ? 180 : 700, easing: 'cubic-bezier(.2,.7,.3,1)' });
}

function pluck(i, vel, delay) {
  send({ type: 'pluck', string: i, vel, delay });
  flash(i, vel);
}

/* Position on the plate, in strings, with string 0 at the bottom. */
function plateCoord(clientY) {
  const r = plateEl.getBoundingClientRect();
  const f = 1 - (clientY - r.top) / r.height;
  return Math.min(STRINGS - 0.0001, Math.max(0, f * STRINGS));
}

/* A finger resting on a line must not chatter, so it has to cross a little past
   the line before the next string counts. Same idea as the stick's sector hysteresis. */
const HYST = 0.18;
const fingers = new Map();   // pointerId -> { idx, t }

plateEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { plateEl.setPointerCapture(e.pointerId); } catch (err) {}
  const idx = Math.floor(plateCoord(e.clientY));
  fingers.set(e.pointerId, { idx, t: e.timeStamp });
  pluck(idx, 0.9, 0);
});

plateEl.addEventListener('pointermove', (e) => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const pos = plateCoord(e.clientY);
  if (pos >= f.idx - HYST && pos < f.idx + 1 + HYST) return;
  const next = Math.floor(pos);
  const dir = next > f.idx ? 1 : -1;
  const n = Math.abs(next - f.idx);
  const dt = Math.max(1, e.timeStamp - f.t);
  // A fast sweep plucks lighter, as in strumVelocity().
  const speed = n / (dt / 1000);
  const vel = Math.min(1, Math.max(0.3, 1 - 0.35 * Math.min(1, speed / 40)));
  // Strings crossed within one move event are spread over the time it covered.
  const span = Math.min(dt, 30) / 1000;
  for (let k = 1; k <= n; k++) pluck(f.idx + dir * k, vel, span * (k - 1) / n);
  f.idx = next; f.t = e.timeStamp;
});

function liftFinger(e) { fingers.delete(e.pointerId); }
plateEl.addEventListener('pointerup', liftFinger);
plateEl.addEventListener('pointercancel', liftFinger);

/* =============================================================================
   Juno phrase plate: eight styles down, four variations across. Holding a finger
   on a style plays it; sliding changes style or variation on the same beat;
   lifting stops it unless HOLD is on.
   ============================================================================= */

const phrasesEl = document.getElementById('phrases');
const phraseRows = [];
JunoEngine.styles().forEach((st, si) => {
  const row = document.createElement('div');
  row.className = 'prow';
  row.innerHTML = '<span class="pname">' + st.name + '</span>' +
    st.v.map((v) => '<span class="pcell">' + v.name + '</span>').join('');
  phrasesEl.appendChild(row);
  phraseRows.push(row);
});

function renderPhrases() {
  const fingerDown = phraseFingers.size > 0;
  phraseRows.forEach((row, si) => {
    row.classList.toggle('playing', !!phrase && phrase.style === si);
    [...row.querySelectorAll('.pcell')].forEach((c, vi) => {
      const on = !!phrase && phrase.style === si && phrase.variation === vi;
      c.classList.toggle('on', on);
      c.classList.toggle('held', on && !fingerDown);
    });
  });
}

function sendPhrase(cell) {
  send({ type: 'phrase', style: cell ? cell.style : -1, variation: cell ? cell.variation : 0 });
  if (cell) phrase = cell;
  else if (!junoState.hold) phrase = null;
  renderPhrases();
  renderReadout();
}

/* Rows are styles; across the cells, past the name column, are the variations.
   A finger on a name plays the first variation. */
function cellAt(e) {
  const r = phrasesEl.getBoundingClientRect();
  const nameW = phraseRows[0].firstChild.getBoundingClientRect().width;
  const style = Math.min(7, Math.max(0, Math.floor((e.clientY - r.top) / r.height * 8)));
  const variation = Math.min(3, Math.max(0, Math.floor((e.clientX - r.left - nameW) / (r.width - nameW) * 4)));
  return { style, variation };
}

const phraseFingers = new Map();   // pointerId -> cell; the newest finger leads
phrasesEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { phrasesEl.setPointerCapture(e.pointerId); } catch (err) {}
  const cell = cellAt(e);
  phraseFingers.delete(e.pointerId);
  phraseFingers.set(e.pointerId, cell);
  sendPhrase(cell);
});
phrasesEl.addEventListener('pointermove', (e) => {
  const old = phraseFingers.get(e.pointerId);
  if (!old) return;
  const cell = cellAt(e);
  if (cell.style === old.style && cell.variation === old.variation) return;
  phraseFingers.set(e.pointerId, cell);
  if ([...phraseFingers.keys()].pop() === e.pointerId) sendPhrase(cell);
});
function liftPhrase(e) {
  if (!phraseFingers.delete(e.pointerId)) return;
  const rest = [...phraseFingers.values()];
  sendPhrase(rest.length ? rest[rest.length - 1] : null);
}
phrasesEl.addEventListener('pointerup', liftPhrase);
phrasesEl.addEventListener('pointercancel', liftPhrase);


/* =============================================================================
   303: the sequencer grid, the filter XY and the transport.
   ============================================================================= */

function currentPattern() { return acidPatterns[+acidPatternSel.value] || acidPatterns[0]; }
function acidSound() { return sounds.acid[+acidSoundSel.value] || sounds.acid[0]; }
const scaleNotes = () => ACID_SCALES[acidState.scale].tones.length;

function sendAcidParams() {
  const snd = acidSound();
  send({ type: 'acidParams', ...snd, scaleMask: ACID_SCALES[acidState.scale].mask,
         key: acidState.key, octave: acidState.octave, pump: acidState.pump });
}
function sendAcidPattern() {
  const pat = currentPattern();
  send({ type: 'acidPattern', steps: clone(pat.steps), length: pat.length });
}


const acidScaleSel = document.getElementById('acidScale');
ACID_SCALES.forEach((sc, i) => acidScaleSel.add(new Option(sc.name, i)));
const acidKeySel = document.getElementById('acidKey');
PC_NAMES.forEach((n, i) => acidKeySel.add(new Option(n, i)));
function syncAcidMenus() {
  acidScaleSel.value = String(acidState.scale);
  acidKeySel.value = String(acidState.key);
}
acidScaleSel.addEventListener('change', () => { acidState.scale = +acidScaleSel.value; sendAcidParams(); buildSeq(); renderReadout(); save(); });
acidKeySel.addEventListener('change', () => { acidState.key = +acidKeySel.value; sendAcidParams(); renderSeq(); renderReadout(); save(); });
acidSoundSel.addEventListener('change', () => { sendAcidParams(); refreshMainFaders(); });
acidPatternSel.addEventListener('change', () => { sendAcidPattern(); renderSeq(); renderReadout(); });

/* A new line, made up the way Chordtroller's 303 does it: it leans on the root
   and the octave, rests often enough to breathe, slides only into notes, and
   starts on the root. How busy, how accented and how high are drawn fresh. */
function randomizePattern() {
  const pat = currentPattern(), notes = scaleNotes(), top = Math.min(24, 2 * notes);
  const restChance = 0.15 + 0.25 * Math.random();
  const accentChance = 0.12 + 0.18 * Math.random();
  const slideChance = 0.08 + 0.20 * Math.random();
  const reach = Math.min(top, Math.max(1, notes + 1 + Math.floor(Math.random() * notes)));
  pat.steps.forEach((st, i) => {
    st.rest = i > 0 && Math.random() < restChance;
    st.accent = Math.random() < accentChance;
    st.slide = Math.random() < slideChance;
    const pick = Math.random();
    st.degree = pick < 0.35 ? 0 : pick < 0.5 ? Math.min(top, notes) : 1 + Math.floor(Math.random() * reach);
  });
  pat.steps[0].degree = 0;
  pat.steps.forEach((st, i) => {
    const next = pat.steps[i === pat.length - 1 ? 0 : (i + 1) % 16];
    if (next.rest) st.slide = false;   // a slide into a rest is a slide nobody hears
  });
}

/* ---------- the grid ----------
   Rows are the scale from the root up to its octave; UP lifts a step an octave,
   which is how a 303 reaches the second octave. */
const seqEl = document.getElementById('seq');
let seqCells = [];          // every cell, with its step and role
let seqCols = [];           // cells by step, for the playhead
let lastPlayhead = -1;

function rowOf(degree) {
  const n = scaleNotes();
  return degree > n ? { k: Math.min(n, degree - n), up: true } : { k: degree, up: false };
}

function buildSeq() {
  const n = scaleNotes();
  seqEl.textContent = '';
  seqCells = []; seqCols = Array.from({ length: 16 }, () => []);
  const add = (cls, s, role, k, text) => {
    const c = document.createElement('div');
    c.className = 'sc ' + cls;
    c.dataset.s = s; c.dataset.role = role; c.dataset.k = k;
    if (text) c.textContent = text;
    seqEl.appendChild(c);
    const rec = { el: c, s, role, k };
    seqCells.push(rec);
    if (s >= 0) seqCols[s].push(rec);
    return rec;
  };
  for (let s = 0; s < 16; s++) add('num', s, 'num', 0, String(s + 1));
  for (let k = n; k >= 0; k--) {
    add('lab' + (k % n === 0 ? ' root' : ''), -1, 'lab', k, '');
    for (let s = 0; s < 16; s++) add('cell' + (k % n === 0 ? ' root' : ''), s, 'note', k);
  }
  for (const [role, text] of [['up', 'UP'], ['acc', 'ACC'], ['sld', 'SLD']]) {
    add('lab', -1, 'lab-' + role, 0, text);
    for (let s = 0; s < 16; s++) add('flag', s, role, 0, '');
  }
  layoutSeq();
  renderSeq();
}

function layoutSeq() {
  const n = scaleNotes(), rows = n + 1 + 3;   // notes, then UP ACC SLD
  seqEl.style.gridTemplateColumns = 'var(--lab, 30px) repeat(16, minmax(0, 1fr))';
  seqEl.style.gridTemplateRows = `14px repeat(${rows}, minmax(0, 1fr))`;
  for (const c of seqCells) {
    // Row 0 the step numbers, then the notes from the top down, then the flags.
    let r;
    if (c.role === 'num') r = 0;
    else if (c.role === 'note' || c.role === 'lab') r = 1 + (n - c.k);
    else r = 1 + (n + 1) + ['up', 'acc', 'sld'].indexOf(c.role.replace('lab-', ''));
    c.el.style.gridRow = String(r + 1);
    c.el.style.gridColumn = String(c.s + 2);   // labels, at step -1, in the first column
  }
}

function renderSeq() {
  if (!seqCells.length) return;
  const pat = currentPattern(), n = scaleNotes();
  const probe = new AcidEngine(48000);
  probe.setScale(ACID_SCALES[acidState.scale].mask); probe.key = acidState.key; probe.octave = acidState.octave;
  for (const c of seqCells) {
    const el = c.el;
    // Sharps unless the key is one of the flat ones, so E minor has its F#.
    if (c.role === 'lab') { el.textContent = noteName(probe.midiOf(c.k), ![5, 10, 3, 8, 1].includes(acidState.key)); continue; }
    if (c.role.startsWith('lab')) continue;
    el.classList.toggle('out', c.s >= pat.length);
    el.classList.toggle('bar4', c.s % 4 === 0 && c.s > 0);
    if (c.role === 'num') { el.classList.toggle('end', c.s === pat.length - 1); continue; }
    const st = pat.steps[c.s], pos = rowOf(st.degree);
    if (c.role === 'note') {
      el.classList.toggle('on', !st.rest && pos.k === c.k);
      el.classList.toggle('acc', !st.rest && pos.k === c.k && st.accent);
    } else {
      const set = c.role === 'up' ? !st.rest && pos.up : c.role === 'acc' ? st.accent : st.slide;
      el.classList.toggle('set', set);
      el.textContent = set ? c.role.toUpperCase() : '';
    }
  }
}

function showPlayhead(stepIndex) {
  lastPlayhead = stepIndex;
  for (let s = 0; s < 16; s++) for (const c of seqCols[s] || []) c.el.classList.toggle('ph', s === stepIndex);
}

/* Tapping a note sets the step there; tapping the note it already has makes it a
   rest. UP, ACC and SLD toggle. A step number sets where the loop ends. */
seqEl.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.sc');
  if (!el) return;
  e.preventDefault();
  const s = +el.dataset.s, role = el.dataset.role, k = +el.dataset.k;
  if (s < 0) return;
  const pat = currentPattern(), st = pat.steps[s], n = scaleNotes(), pos = rowOf(st.degree);
  if (role === 'num') { pat.length = s + 1; }
  else if (role === 'note') {
    if (!st.rest && pos.k === k) st.rest = true;
    else { st.rest = false; st.degree = k + (pos.up && k < n ? n : 0); }
  }
  else if (role === 'up') {
    if (st.rest) st.rest = false;
    else st.degree = pos.up ? pos.k : Math.min(2 * n, pos.k + n);
  }
  else if (role === 'acc') st.accent = !st.accent;
  else if (role === 'sld') st.slide = !st.slide;
  sendAcidPattern();
  if (role !== 'num' && !st.rest) send({ type: 'acidAudition', degree: st.degree, accent: st.accent });
  renderSeq();
  renderReadout();
  save();
});

   along the row or down the column, so a run of hats is one stroke. */

  const t = +c.dataset.t, s = +c.dataset.s, key = t + ':' + s;

  paint = { pointerId: e.pointerId, value, done: new Set() };

const drumShows = [];
function drumFader(id, key, min, max, log, fmt) {
  const el = document.getElementById(id);
  const fill = el.querySelector('.fill'), val = el.querySelector('.fval');
  const centred = min < 0;
  const toPos = (v) => (log ? Math.log(v / min) / Math.log(max / min) : (v - min) / (max - min));
  const fromPos = (p) => (log ? min * Math.pow(max / min, p) : min + p * (max - min));
  const params = () => drumState.params[drumState.sel];
  const show = () => {
    const p = Math.min(1, Math.max(0, toPos(params()[key])));
    if (centred) {
      fill.style.left = Math.min(p, 0.5) * 100 + '%';
      fill.style.width = Math.abs(p - 0.5) * 100 + '%';
    } else fill.style.width = p * 100 + '%';
    val.textContent = fmt(params()[key]);
    el.setAttribute('aria-valuetext', val.textContent);
  };
  drumShows.push(show);
  const set = (p) => {
    let v = fromPos(Math.min(1, Math.max(0, p)));
    // Each knob has a detent where the game had it.
    const home = PumpKit.defaults()[drumState.sel][key];
    if (Math.abs(toPos(v) - toPos(home)) < 0.025) v = home;
    params()[key] = v;
    show(); sendDrumParams();
  };
  const setFrom = (x) => { const r = el.getBoundingClientRect(); set((x - r.left) / r.width); };
  let lastTap = 0;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    // A double tap puts the knob back where the game had it.
    if (e.timeStamp - lastTap < 300) {
      params()[key] = PumpKit.defaults()[drumState.sel][key];
      show(); sendDrumParams(); save(); lastTap = 0;
      return;
    }
    lastTap = e.timeStamp;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.dataset.drag = e.pointerId;
    setFrom(e.clientX);
  });
  el.addEventListener('pointermove', (e) => { if (el.dataset.drag == e.pointerId) setFrom(e.clientX); });
  const end = () => { if (el.dataset.drag) save(); delete el.dataset.drag; };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 0.02, ArrowUp: 0.02, ArrowLeft: -0.02, ArrowDown: -0.02 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    set(toPos(params()[key]) + d); save();
  });
  show();
}

/* A new groove the way the game builds one: the kick on the floor with a push
   now and then, a backbeat on clap or snare, hats in one of three densities,
   and the rest sprinkled. */
function randomizeDrums() {
  const steps = Array.from({ length: 8 }, () => new Array(16).fill(0));
  const r = Math.random, chance = (p) => r() < p;
  for (let s = 0; s < 16; s += 4) steps[0][s] = s === 0 ? 2 : 1;
  for (const s of [3, 7, 10, 11, 14, 15]) if (chance(0.12)) steps[0][s] = 1;
  const back = chance(0.5) ? 1 : 2;
  steps[back][4] = steps[back][12] = 2;
  if (chance(0.35)) steps[3 - back][chance(0.5) ? 14 : 7] = 1;   // a ghost on the other one
  const hats = r();
  for (let s = 0; s < 16; s++) {
    const on = hats < 0.4 ? s % 4 === 2 : hats < 0.75 ? s % 2 === 0 : true;
    if (on) steps[3][s] = s % 4 === 2 ? 2 : 1;
  }
  if (chance(0.6)) for (const s of [2, 6, 10, 14]) if (chance(0.5)) { steps[4][s] = 1; steps[3][s] = 0; }
  if (chance(0.5)) for (let s = 1; s < 16; s += 2) if (chance(0.6)) steps[5][s] = chance(0.2) ? 2 : 1;
  const percHits = Math.floor(r() * 4);
  for (let i = 0; i < percHits; i++) steps[6][1 + 2 * Math.floor(r() * 8)] = 1;
  if (chance(0.3)) steps[7][0] = 1;
  drumPattern().steps = steps;
}

    '<div class="tfader" role="slider" tabindex="0" aria-label="' + name + ' transpose"><span class="tfill"></span><span class="tzero"></span><span class="tval"></span><span class="tlab">Key</span></div>' +
    '</div>' +
    '<div class="bip" role="slider" tabindex="0" aria-label="' + name + ' filter"><span class="bfill"></span><span class="bcenter"></span>' +
    '<span class="blab"><span>LP</span><b></b><span>HP</span></span></div>';
  mixerEl.appendChild(strip);
  const st = mixState[ch];
  const muteBtn = strip.querySelector('.mute'), vf = strip.querySelector('.vfader'), bip = strip.querySelector('.bip');
  const vfill = vf.querySelector('.vfill'), vval = vf.querySelector('.vval');
  const bfill = bip.querySelector('.bfill'), blab = bip.querySelector('.blab b');
  const tf = strip.querySelector('.tfader'), tfill = tf.querySelector('.tfill'), tval = tf.querySelector('.tval');
  const show = () => {
    const t = st.transpose || 0, tp = (t + 12) / 24;
    tfill.style.bottom = Math.min(tp, 0.5) * 100 + '%';
    tfill.style.height = Math.abs(tp - 0.5) * 100 + '%';
    tval.textContent = (t > 0 ? '+' : t < 0 ? '−' : '') + Math.abs(t);
    tf.classList.toggle('moved', t !== 0);
    tf.setAttribute('aria-valuetext', t === 0 ? 'no transpose' : (t > 0 ? 'up ' : 'down ') + Math.abs(t) + ' semitones');
    muteBtn.setAttribute('aria-pressed', String(st.mute));
    strip.classList.toggle('muted', st.mute);
    vfill.style.height = st.volume * 100 + '%';
    const g = OmniDSP.faderGain(st.volume);
    vval.textContent = g <= 0 ? '−∞' : (20 * Math.log10(g) > 0.05 ? '+' : '') + (20 * Math.log10(g)).toFixed(1).replace('-', '−') + ' dB';
    vf.setAttribute('aria-valuetext', vval.textContent);
    const p = (st.filter + 1) / 2;
    bfill.style.left = Math.min(p, 0.5) * 100 + '%';
    bfill.style.width = Math.abs(p - 0.5) * 100 + '%';
    blab.textContent = st.filter === 0 ? 'Off' : Math.round(Math.abs(st.filter) * 100);
    bip.setAttribute('aria-valuetext', st.filter === 0 ? 'Off' : (st.filter < 0 ? 'Low-pass ' : 'High-pass ') + blab.textContent);
  };
  mixShows.push(show);
  const after = () => { show(); sendMixer(ch); };
  muteBtn.addEventListener('click', () => { st.mute = !st.mute; after(); renderTabsMuted(); save(); });
  stripControl(vf, (e) => { const r = vf.getBoundingClientRect(); return 1 - (e.clientY - r.top) / r.height; },
    (v) => {
      v = Math.min(1, Math.max(0, v));
      st.volume = Math.abs(v - 0.8) < 0.025 ? 0.8 : v;   // a detent at unity
    }, 0.8, after);
  // Transpose: up and down an octave, in whole semitones, from where the finger is.
  stripControl(tf, (e) => { const r = tf.getBoundingClientRect(); return (1 - (e.clientY - r.top) / r.height) * 24 - 12; },
    (v) => { st.transpose = Math.max(-12, Math.min(12, Math.round(v))); }, 0, after);
  tf.addEventListener('keydown', (e) => {
    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (d === undefined) return;
    e.preventDefault(); st.transpose = Math.max(-12, Math.min(12, (st.transpose || 0) + d)); after(); save();
  });
  stripControl(bip, (e) => { const r = bip.getBoundingClientRect(); return ((e.clientX - r.left) / r.width) * 2 - 1; },
    (v) => {
      v = Math.min(1, Math.max(-1, v));
      st.filter = Math.abs(v) < 0.06 ? 0 : v;   // a dead zone in the middle, where it is off
    }, 0, after);
  vf.addEventListener('keydown', (e) => {
    const d = { ArrowUp: 0.02, ArrowRight: 0.02, ArrowDown: -0.02, ArrowLeft: -0.02 }[e.key];
    if (d === undefined) return;
    e.preventDefault(); st.volume = Math.min(1, Math.max(0, st.volume + d)); after(); save();
  });
  bip.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 0.04, ArrowLeft: -0.04 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    const v = Math.min(1, Math.max(-1, st.filter + d));
    st.filter = Math.abs(v) < 0.03 ? 0 : v;
    after(); save();
  });
  show();
}
document.getElementById('mixReset').addEventListener('click', () => {
  for (const [ch] of MIX_CHANNELS) { Object.assign(mixState[ch], { volume: 0.8, mute: false, filter: 0, transpose: 0 }); sendMixer(ch); }
  mixShows.forEach((f) => f());
  renderTabsMuted();
  save();
});


/* =============================================================================
   The Juno's loop recorder. REC starts PLAY if it is not running and records
   from the next bar line: the chord buttons and the phrase plate, quantised to
   sixteenths, for one, two or four bars. Then it plays what was played, over
   and over, while the other tabs are in front.
   ============================================================================= */

const recEl = document.getElementById('rec');
const loopPlayBtn = document.getElementById('loopPlay');
const loopClearBtn = document.getElementById('loopClear');
const loopProgEl = document.getElementById('loopProg');
const loopBarBtns = [...document.querySelectorAll('#loopBars button')];


document.getElementById('loopRec').addEventListener('click', () => {
  if (!transport.playing) setTransport(true);
  send({ type: 'loopArm' });
});
for (const b of loopBarBtns) b.addEventListener('click', () => send({ type: 'loopBars', bars: +b.dataset.bars }));
loopPlayBtn.addEventListener('click', () => send({ type: 'loopToggle' }));
loopClearBtn.addEventListener('click', () => {
  if (!loopClearBtn.dataset.armed) { arm(loopClearBtn, true); return; }
  arm(loopClearBtn, false);
  send({ type: 'loopClear' });
});

function renderLoop() {
  recEl.dataset.state = loopUI.state;
  document.getElementById('loopRec').setAttribute('aria-label',
    { armed: 'Recording from the next bar', rec: 'Recording; tap to stop' }[loopUI.state] || 'Record');
  for (const b of loopBarBtns) b.setAttribute('aria-pressed', String(+b.dataset.bars === loopUI.bars));
  loopPlayBtn.setAttribute('aria-pressed', String(loopUI.state === 'play'));
  loopPlayBtn.disabled = !loopUI.events.length || loopUI.state === 'rec';
  loopClearBtn.disabled = !loopUI.events.length && loopUI.state !== 'rec';
}

function onLoop(m) {
  const was = loopUI.state;
  Object.assign(loopUI, { state: m.state, bars: m.bars, events: m.events });
  // The loop going quiet takes its phrase with it, unless a finger is on the plate.
  if (was === 'play' && m.state !== 'play' && !phraseFingers.size) { phrase = null; renderPhrases(); if (inst === 'juno') renderReadout(); }
  if (m.state !== 'play' && m.state !== 'rec') showLoopPos(-1);
  renderLoop();
  save();
}

function onLoopEvent(e) {
  if (e.kind === 'chord') {
    if (e.root == null) return;
    chordState.juno = makeChord(e.root, e.quality, labelFor(e.root, e.quality));
    if (inst === 'juno') { current = chordState.juno; renderKeys(); renderReadout(); }
  } else {
    if (phraseFingers.size) return;   // the finger is what is playing
    if (e.style >= 0) phrase = { style: e.style, variation: e.variation };
    else if (!junoState.hold) phrase = null;
    renderPhrases();
    if (inst === 'juno') renderReadout();
  }
}

function showLoopPos(pos) {
  loopProgEl.style.width = pos < 0 ? '0' : ((pos + 1) / (loopUI.bars * 16)) * 100 + '%';
}

// The drums, mixer and loop as they were left.
rebuildDrumMenu();
document.getElementById('drumName').textContent = DRUM_NAMES[drumState.sel];
renderDrumGrid();
drumShows.forEach((f) => f());
renderTabsMuted();
if (loopUI.state !== 'play' && loopUI.state !== 'off') loopUI.state = loopUI.events.length ? 'play' : 'empty';
renderLoop();

/* ---------- chord layout menu ---------- */
const layoutSel = document.getElementById('layoutSel');
// A chord from the loop is spelled the way the keys in front spell it.
function labelFor(pc, quality) {
  const c = layout.map && layout.map.cells.find((x) => x.pc === pc && (layout.map.combo || x.q === quality))
         || layout.map && layout.map.cells.find((x) => x.pc === pc);
  return c ? c.label : rootName(pc);
}
function setLayout(value) {
  const [kind, tonic] = value.split(':');
  layout.kind = kind; layout.tonic = +tonic || 0;
  layoutSel.value = value;
  // The chords playing keep playing, spelled the new way.
  for (const part of ['omni', 'juno']) chordState[part].label = labelFor(chordState[part].pc, chordState[part].quality);
  buildKeys();
  renderReadout();
  if (inst === 'omni') renderPlate();
}
layoutSel.addEventListener('change', () => { setLayout(layoutSel.value); save(); });

// iOS still scrolls and zooms on touchmove unless it is cancelled outright.
document.addEventListener('touchmove', (e) => {
  if (e.target.closest && e.target.closest('.ed-body')) return;   // the editor scrolls
  e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// Open on C major, the way the instrument wakes up, on the tab last used.
document.body.dataset.inst = 'omni';
bpmOut.textContent = rhythm.bpm;
metroBtn.setAttribute('aria-pressed', String(transport.metronome));
setLayout(savedLayout);
setChord(0, 'maj');
let lastTab = 'drums';
try { lastTab = localStorage.getItem(STORE + '-tab') || 'drums'; } catch (e) {}
setTab(tabEls.some((t) => t.dataset.tab === lastTab) ? lastTab : 'drums');
</script>
