<body><!--repo-only-->

<div id="app">
  <header class="bar">
    <label class="sr" for="instrument">Instrument</label>
    <select id="instrument" class="sel inst">
      <option value="omni" selected>Omni</option>
      <option value="juno">Juno</option>
    </select>
    <div class="readout" aria-live="polite">
      <span class="label">Ackord</span>
      <span id="chordName">C</span>
      <span id="subName" class="sub"></span>
    </div>
    <div class="rhythm" role="group" aria-label="Rytm">
      <span class="beat" id="beatLed" aria-hidden="true"></span>
      <button class="transport omni-only" id="startStop" type="button" aria-pressed="false">Start</button>
      <label class="sr" for="pattern">Rytm</label>
      <select id="pattern" class="sel omni-only">
        <option value="rock" selected>Rock</option>
        <option value="vamp">Vamp</option>
        <option value="march">Marsch</option>
        <option value="bossa">Bossa</option>
        <option value="swing">Swing</option>
        <option value="waltz">Vals</option>
      </select>
      <div class="tempo">
        <button type="button" id="tempoDown" aria-label="Långsammare">&minus;</button>
        <output id="bpm" aria-label="Tempo i slag per minut">96</output>
        <button type="button" id="tempoUp" aria-label="Snabbare">+</button>
      </div>
    </div>
    <button class="power" id="power" type="button">Slå på ljudet</button>
    <div class="fx omni-only">
      <label class="sr" for="voice">Ljud</label>
      <select id="voice" class="sel">
        <option value="0" selected>Omni</option>
        <option value="1">Harpa</option>
        <option value="2">Vibrafon</option>
        <option value="3">Gitarr</option>
      </select>
      <button class="toggle" id="chordToggle" type="button" aria-pressed="true">Ackordljud</button>
      <button class="toggle" id="bassToggle" type="button" aria-pressed="true">Autobas</button>
      <button class="toggle" id="chorusToggle" type="button" aria-pressed="true">Chorus</button>
      <button class="toggle" id="reverbToggle" type="button" aria-pressed="true">Rum</button>
    </div>
    <div class="fx juno-only">
      <label class="sr" for="genre">Genre</label>
      <select id="genre" class="sel"></select>
      <label class="sr" for="patch">Ljud</label>
      <select id="patch" class="sel"></select>
      <label class="sr" for="junoChorus">Chorus</label>
      <select id="junoChorus" class="sel">
        <option value="0">Chorus av</option>
        <option value="1" selected>Chorus I</option>
        <option value="2">Chorus II</option>
        <option value="3">Chorus I+II</option>
      </select>
      <button class="toggle" id="junoBassToggle" type="button" aria-pressed="true">Bas</button>
      <button class="toggle" id="extToggle" type="button" aria-pressed="false">Utökad</button>
      <button class="toggle" id="holdToggle" type="button" aria-pressed="false">Håll</button>
    </div>
    <span class="hint">Två i samma kolumn: dur+moll&nbsp;=&nbsp;dim, dur+7&nbsp;=&nbsp;maj7, moll+7&nbsp;=&nbsp;m7</span>
  </header>

  <div class="keys" id="keys" role="group" aria-label="Ackordknappar"></div>

  <div class="side">
    <div class="plate omni-only" id="plate" role="application" aria-label="Strumplatta, dra fingret över strängarna"></div>
    <div class="phrases juno-only" id="phrases" role="application" aria-label="Frasplatta: håll på en stil för att spela den, sidled väljer variation"></div>
    <div class="filters juno-only">
      <div class="fader" id="cutoffFader" role="slider" tabindex="0" aria-label="Cutoff" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
        <span class="fill"></span><span class="flabel">Cutoff</span><span class="fval">60</span>
      </div>
      <div class="fader" id="resFader" role="slider" tabindex="0" aria-label="Resonans" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15">
        <span class="fill"></span><span class="flabel">Resonans</span><span class="fval">15</span>
      </div>
    </div>
  </div>
</div>

<script>
/* =============================================================================
   DSP — ported from Source/dsp/PluckVoice.h, Ensemble.h and juce::Reverb.
   These classes must not reference anything outside themselves: their source text
   is what goes into the AudioWorklet.
   ============================================================================= */

class PluckVoice {
  constructor(sr) {
    this.sr = sr;
    this.active = false; this.attacking = false;
    this.env = 0; this.lp = 0;
    this.p1 = 0; this.p2 = 0.37; this.i1 = 0; this.i2 = 0;
    this.target = 1; this.atk = 0.01; this.decay = 0.999;
    this.g = 0.5; this.width = 0.35; this.wave = 'pulse';
    this.string = -1; this.stamp = 0;
  }

  start(freq, vel, decay, spec, string, stamp) {
    const spread = Math.pow(2, spec.detune / 1200);
    this.i1 = freq / spread / this.sr;
    this.i2 = freq * spread / this.sr;
    // A string struck again is still moving; resetting its phase would click.
    if (!this.active) { this.p1 = 0; this.p2 = 0.37; this.lp = 0; }
    this.target = Math.min(1, Math.max(0, vel));
    this.atk = this.target / Math.max(1, this.sr * spec.attack);
    this.attacking = true;
    this.decay = decay;
    const cutoff = Math.min(14000, Math.max(800, freq * spec.filter));
    this.g = 1 - Math.exp(-2 * Math.PI * cutoff / this.sr);
    this.width = spec.width; this.wave = spec.wave;
    this.string = string; this.stamp = stamp;
    this.active = true;
  }

  static blep(t, dt) {
    if (dt <= 0) return 0;
    if (t < dt) { t /= dt; return t + t - t * t - 1; }
    if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
    return 0;
  }

  osc(p, inc) {
    if (this.wave === 'sine') return Math.sin(2 * Math.PI * p);
    if (this.wave === 'saw') return (2 * p - 1) - PluckVoice.blep(p, inc);
    const w = this.width;
    let v = p < w ? 1 : -1;
    v += PluckVoice.blep(p, inc);
    let f = p + (1 - w); if (f >= 1) f -= 1;
    return v - PluckVoice.blep(f, inc);
  }

  process() {
    if (!this.active) return 0;
    if (this.attacking) {
      this.env += this.atk;
      if (this.env >= this.target) { this.env = this.target; this.attacking = false; }
    } else {
      this.env *= this.decay;
      if (this.env < 1e-4) { this.active = false; this.env = 0; return 0; }
    }
    const raw = (this.osc(this.p1, this.i1) + this.osc(this.p2, this.i2)) * 0.5;
    this.p1 += this.i1; if (this.p1 >= 1) this.p1 -= 1;
    this.p2 += this.i2; if (this.p2 >= 1) this.p2 -= 1;
    const g = Math.min(0.99, Math.max(0.0005, this.g * (0.35 + 0.65 * this.env)));
    this.lp += g * (raw - this.lp);
    return this.lp * this.env;
  }
}

/* The Juno-style chorus: one triangle LFO read half a cycle apart for width,
   1.2–6 ms of delay, no feedback, a 7 kHz pole on the wet path. */
class Ensemble {
  constructor(sr) {
    this.sr = sr;
    this.buf = new Float32Array(Math.floor(sr * 0.05) + 4);
    this.w = 0; this.phase = 0; this.rate = 0.5; this.mix = 0.45;
    this.lpL = 0; this.lpR = 0;
    this.lpc = 1 - Math.exp(-2 * Math.PI * 7000 / sr);
  }
  static tri(p) { p -= Math.floor(p); return 1 - Math.abs(2 * p - 1); }
  tap(ms) {
    const size = this.buf.length;
    let pos = this.w - ms * 0.001 * this.sr;
    while (pos < 0) pos += size;
    const a = pos | 0, b = (a + 1) % size, fr = pos - a;
    return this.buf[a] * (1 - fr) + this.buf[b] * fr;
  }
  process(x, out) {
    this.buf[this.w] = x;
    this.phase += this.rate / this.sr; if (this.phase >= 1) this.phase -= 1;
    const wl = this.tap(1.2 + Ensemble.tri(this.phase) * 4.8);
    const wr = this.tap(1.2 + Ensemble.tri(this.phase + 0.5) * 4.8);
    this.lpL += this.lpc * (wl - this.lpL);
    this.lpR += this.lpc * (wr - this.lpR);
    out[0] = x * (1 - this.mix) + this.lpL * this.mix;
    out[1] = x * (1 - this.mix) + this.lpR * this.mix;
    if (++this.w >= this.buf.length) this.w = 0;
  }
}

/* The accompaniment's voice, from CompVoice.h: an organ, more or less. Three
   sines at 1x, 2x and 3x, a 6 ms attack and a 130 ms release. A gate of zero
   holds until noteOff, which is what the held chord is; the rhythm's stabs give
   it a length. Phase is kept on retune so a chord change does not click. */
class CompVoice {
  constructor(sr, octave, twelfth) {
    this.sr = sr; this.second = octave; this.third = twelfth;
    this.atk = 1 / Math.max(1, sr * 0.006);
    this.rel = 1 / Math.max(1, sr * 0.130);
    this.env = 0; this.phase = 0; this.inc = 0; this.level = 0;
    this.active = false; this.holding = false; this.gate = -1;
  }
  noteOn(freq, level, gateSeconds) {
    this.inc = freq / this.sr; this.level = level;
    this.gate = gateSeconds > 0 ? Math.round(gateSeconds * this.sr) : -1;
    if (!this.active) this.phase = 0;
    this.holding = true; this.active = true;
  }
  setFrequency(freq) { this.inc = freq / this.sr; }
  noteOff() { this.holding = false; }
  process() {
    if (!this.active) return 0;
    if (this.gate > 0 && --this.gate === 0) this.holding = false;
    if (this.holding) this.env = Math.min(1, this.env + this.atk);
    else {
      this.env -= this.rel;
      if (this.env <= 0) { this.env = 0; this.active = false; return 0; }
    }
    const t = 2 * Math.PI * this.phase;
    const v = Math.sin(t) + this.second * Math.sin(2 * t) + this.third * Math.sin(3 * t);
    this.phase += this.inc; if (this.phase >= 1) this.phase -= 1;
    return v * this.env * this.level;
  }
}

/* Three drums, made rather than sampled, from DrumKit.h: a kick is a sine
   falling off a cliff, a snare is noise with a tuned thump under it, a hat is
   noise with the bottom taken out. */
class DrumKit {
  constructor(sr) {
    this.sr = sr;
    const dc = (sec) => Math.pow(0.001, 1 / Math.max(1, sr * sec));
    this.kickDecay = dc(0.28); this.kickPitchDecay = dc(0.035);
    this.snareToneDecay = dc(0.09); this.snareHissDecay = dc(0.16);
    this.hatDecay = dc(0.045);
    this.kickEnv = 0; this.kickPitchEnv = 0; this.kickPhase = 0;
    this.snareToneEnv = 0; this.snareHissEnv = 0; this.snarePhase = 0; this.snareLow = 0;
    this.hatEnv = 0; this.hatLow = 0;
    this.rng = 0x9e3779b9 | 0;
  }
  trigger(piece, level) {
    if (piece === 'kick') { this.kickEnv = level; this.kickPitchEnv = 1; }
    else if (piece === 'snare') { this.snareToneEnv = level * 0.8; this.snareHissEnv = level; }
    else this.hatEnv = level;
  }
  noise() {
    let x = this.rng;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    this.rng = x | 0;
    return this.rng / 2147483648;
  }
  process() {
    const F = 1e-4, TWO_PI = 2 * Math.PI;
    let out = 0;
    if (this.kickEnv > F) {
      // 150 Hz down to 46 in about a thirtieth of a second. The drop is the drum.
      this.kickPhase += (46 + 105 * this.kickPitchEnv) / this.sr;
      if (this.kickPhase >= 1) this.kickPhase -= 1;
      out += Math.sin(TWO_PI * this.kickPhase) * this.kickEnv;
      this.kickEnv *= this.kickDecay; this.kickPitchEnv *= this.kickPitchDecay;
    }
    const n = this.noise();
    if (this.snareHissEnv > F) {
      this.snareLow += 0.55 * (n - this.snareLow);
      out += (n - this.snareLow) * this.snareHissEnv * 0.45;
      this.snareHissEnv *= this.snareHissDecay;
    }
    if (this.snareToneEnv > F) {
      this.snarePhase += 190 / this.sr; if (this.snarePhase >= 1) this.snarePhase -= 1;
      out += Math.sin(TWO_PI * this.snarePhase) * this.snareToneEnv * 0.35;
      this.snareToneEnv *= this.snareToneDecay;
    }
    if (this.hatEnv > F) {
      this.hatLow += 0.82 * (n - this.hatLow);
      out += (n - this.hatLow) * this.hatEnv * 0.26;
      this.hatEnv *= this.hatDecay;
    }
    return out;
  }
}

/* The accompaniment, from CompEngine.h: chord, auto-bass and drums on one clock.
   Stopped, it is the Omnichord's manual mode, a chord and a root held for as long
   as a button is. Running, it plays one of the six rhythm figures on the last
   chord pressed, with the bass alternating root and fifth. */
class Comp {
  constructor(sr) {
    this.sr = sr;
    this.cv = [0, 1, 2].map(() => new CompVoice(sr, 0.42, 0.18));   // octave and twelfth: an organ
    this.bass = new CompVoice(sr, 0.30, 0.04);                      // almost pure, so it stays under
    this.drums = new DrumKit(sr);
    this.notes = [55, 59, 62]; this.root = 36; this.fifth = 43;
    this.alt = false;
    this.running = false; this.holding = false;
    this.chordOn = true; this.bassOn = true;
    this.pattern = 'rock'; this.bpm = 96;
    this.step = -1; this.counter = 0; this.spb = 1;
    this.beat = -1;
    this.updateClock();
  }

  /* Which steps each part lands on. The grid is per figure: SWING runs on
     triplets because a shuffle cannot be written in sixteenths, and VALS keeps
     sixteenths but has three beats to the bar. */
  static figure(p) {
    const at = (...s) => s.reduce((m, x) => m | (1 << x), 0);
    const hat16 = at(0, 2, 4, 6, 8, 10, 12, 14);
    const F = {
      vamp:  { bass: at(0, 8), chord: at(4, 12), kick: at(0, 8), snare: at(4, 12), hat: hat16, spb: 4, beats: 4, bg: 0.34, cg: 0.24 },
      march: { bass: at(0, 4, 8, 12), chord: at(4, 12), kick: at(0, 4, 8, 12), snare: at(4, 12), hat: hat16, spb: 4, beats: 4, bg: 0.20, cg: 0.22 },
      rock:  { bass: at(0, 3, 8, 11), chord: at(4, 12), kick: at(0, 3, 8, 11), snare: at(4, 12), hat: hat16, spb: 4, beats: 4, bg: 0.22, cg: 0.26 },
      bossa: { bass: at(0, 6, 8, 14), chord: at(2, 6, 10, 14), kick: at(0, 6, 8, 14), snare: at(3, 10), hat: hat16, spb: 4, beats: 4, bg: 0.26, cg: 0.18 },
      swing: { bass: at(0, 6), chord: at(3, 9), kick: at(0), snare: at(3, 9), hat: at(0, 2, 3, 6, 8, 9), spb: 3, beats: 4, bg: 0.28, cg: 0.20 },
      waltz: { bass: at(0), chord: at(4, 8), kick: at(0), snare: at(4, 8), hat: at(0, 2, 4, 6, 8, 10), spb: 4, beats: 3, bg: 0.30, cg: 0.22 }
    };
    return F[p] || F.rock;
  }

  static hz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  updateClock() {
    const f = Comp.figure(this.pattern);
    this.fig = f;
    this.spb = Math.max(1, Math.round(this.sr * 60 / this.bpm / f.spb));
  }

  setChord(m) {
    this.notes = m.chord; this.root = m.bass; this.fifth = m.fifth;
    this.alt = false;
    if (!this.running) { if (this.holding) this.strikeHeld(); return; }
    // A rhythm waits for its next hit before striking again, but whatever is
    // already sounding follows the chord at once rather than sitting on the old root.
    for (let i = 0; i < 3; i++) if (this.cv[i].active) this.cv[i].setFrequency(Comp.hz(this.notes[i]));
    if (this.bass.active) this.bass.setFrequency(Comp.hz(this.root));
  }

  configure(m) {
    this.chordOn = m.chordOn; this.bassOn = m.bassOn;
    if (m.bpm !== this.bpm) { this.bpm = Math.min(220, Math.max(40, m.bpm)); this.updateClock(); }
    if (m.pattern !== this.pattern) {
      this.pattern = m.pattern; this.updateClock();
      // Changing figure mid-bar restarts the bar.
      if (this.running) { this.step = -1; this.counter = 0; this.releaseAll(); }
    }
    if (m.running !== this.running) {
      this.running = m.running;
      this.step = -1; this.counter = 0;
      this.releaseAll();
      if (!this.running) this.beat = -1;
    }
    if (!this.running) { if (this.holding) this.strikeHeld(); else this.releaseAll(); }
  }

  setHold(on) {
    this.holding = on;
    if (this.running) return;
    if (on) this.strikeHeld(); else this.releaseAll();
  }

  // Sustained sits lower than struck: a held chord is present the whole time.
  strikeHeld() {
    for (let i = 0; i < 3; i++) {
      if (this.chordOn) this.cv[i].noteOn(Comp.hz(this.notes[i]), 0.15, 0);
      else this.cv[i].noteOff();
    }
    if (this.bassOn) this.bass.noteOn(Comp.hz(this.root), 0.28, 0);
    else this.bass.noteOff();
  }

  releaseAll() {
    for (const v of this.cv) v.noteOff();
    this.bass.noteOff();
  }

  fire(step) {
    const f = this.fig, hit = (mask) => ((mask >> step) & 1) !== 0;
    if (hit(f.kick)) this.drums.trigger('kick', 0.95);
    if (hit(f.snare)) this.drums.trigger('snare', 0.75);
    if (hit(f.hat)) this.drums.trigger('hat', step % 4 === 0 ? 0.55 : 0.34);
    if (this.bassOn && hit(f.bass)) {
      this.bass.noteOn(Comp.hz(this.alt ? this.fifth : this.root), 0.55, f.bg);
      this.alt = !this.alt;
    }
    if (this.chordOn && hit(f.chord))
      for (let i = 0; i < 3; i++) this.cv[i].noteOn(Comp.hz(this.notes[i]), 0.26, f.cg);
    if (step % f.spb === 0) this.beat = step / f.spb;
  }

  process() {
    if (this.running && --this.counter <= 0) {
      this.counter = this.spb;
      this.step = (this.step + 1) % (this.fig.spb * this.fig.beats);
      this.fire(this.step);
    }
    let sum = this.bass.process();
    for (let k = 0; k < 3; k++) sum += this.cv[k].process();
    // Loud enough to drive, quiet enough to stay behind the plate.
    sum += this.drums.process() * 0.55;
    return sum;
  }
}

/* Freeverb as juce::Reverb runs it, with Chordtroller's room:
   size 0.62, damping 0.42, wet 0.30, dry 1.0, width 1.0. */
class Freeverb {
  constructor(sr) {
    const scale = sr / 44100;
    const combs = [1116, 1188, 1277, 1356, 1422, 1491, 1557, 1617];
    const alls = [556, 441, 341, 225];
    const mk = (n) => ({ b: new Float32Array(Math.max(1, Math.round(n * scale))), i: 0, last: 0 });
    this.cL = combs.map((n) => mk(n));
    this.cR = combs.map((n) => mk(n + 23));
    this.aL = alls.map((n) => mk(n));
    this.aR = alls.map((n) => mk(n + 23));
    this.fb = 0.62 * 0.28 + 0.7;
    this.d1 = 0.42 * 0.4; this.d2 = 1 - this.d1;
    this.wet1 = 0.5 * (0.30 * 3) * 2; this.wet2 = 0;
    this.dry = 1.0 * 2;
    this.on = true;
  }
  comb(c, x) {
    const o = c.b[c.i];
    c.last = o * this.d2 + c.last * this.d1;
    if (Math.abs(c.last) < 1e-20) c.last = 0;
    c.b[c.i] = x + c.last * this.fb;
    if (++c.i >= c.b.length) c.i = 0;
    return o;
  }
  allpass(a, x) {
    const o = a.b[a.i];
    a.b[a.i] = x + o * 0.5;
    if (++a.i >= a.b.length) a.i = 0;
    return o - x;
  }
  process(io) {
    const l = io[0], r = io[1];
    // Fed even when switched off, so turning it back on finds a live room.
    const x = (l + r) * 0.015;
    let ol = 0, or = 0;
    for (let k = 0; k < 8; k++) { ol += this.comb(this.cL[k], x); or += this.comb(this.cR[k], x); }
    for (let k = 0; k < 4; k++) { ol = this.allpass(this.aL[k], ol); or = this.allpass(this.aR[k], or); }
    const wet = this.on ? 1 : 0;
    io[0] = wet * (ol * this.wet1 + or * this.wet2) + l * this.dry;
    io[1] = wet * (or * this.wet1 + ol * this.wet2) + r * this.dry;
  }
}

/* =============================================================================
   Juno — ported from Source/dsp/JunoVoice.h, JunoEngine.h, JunoPhrases.h,
   TempoDelay.h and Source/music/JunoChords.h. MIDI out is left behind; the rest
   is the same instrument.
   ============================================================================= */

/* One Juno voice: a DCO (saw, pulse, a square an octave down, a little noise)
   into a zero-delay-feedback four-pole ladder, one envelope shared between filter
   and amplifier. That sharing is why a Juno pluck brightens and dies in one gesture. */
class JunoVoice {
  constructor(sr) {
    this.sr = sr; this.patch = null;
    this.phase = 0; this.subPhase = 0; this.inc = 0;
    this.env = 0; this.vel = 1;
    this.atk = 0.01; this.decayC = 0.999; this.relC = 0.999;
    this.hpfC = 0.001; this.hpLow = 0;
    this.s1 = 0; this.s2 = 0; this.s3 = 0; this.s4 = 0;
    this.stage = 0;   // 0 idle, 1 attack, 2 decay, 3 sustain, 4 release
    this.active = false; this.gateOn = false;
    this.note = -1; this.gate = -1; this.stamp = 0;
    this.rng = 0x2545f491 | 0;
  }
  coef(sec) { return Math.pow(0.001, 1 / Math.max(1, this.sr * sec)); }
  setPatch(p) {
    this.patch = p;
    this.atk = 1 / Math.max(1, this.sr * p.attack);
    this.decayC = this.coef(p.decay);
    this.relC = this.coef(p.release);
    this.hpfC = 1 - Math.exp(-2 * Math.PI * (20 * Math.pow(2, p.hpf * 5.3)) / this.sr);
  }
  noteOn(note, vel, gateLen, order) {
    // The oscillators keep running through a retrigger; resetting them clicks.
    if (!this.active) { this.phase = 0; this.subPhase = 0; }
    this.note = note; this.vel = vel;
    this.gate = gateLen > 0 ? gateLen : -1;
    this.inc = 440 * Math.pow(2, (note - 69) / 12) / this.sr;
    this.stage = 1; this.active = true; this.gateOn = true; this.stamp = order;
  }
  noteOff() { if (!this.gateOn) return; this.gateOn = false; this.stage = 4; }
  static blep(t, dt) {
    if (dt <= 0) return 0;
    if (t < dt) { t /= dt; return t + t - t * t - 1; }
    if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
    return 0;
  }
  static softClip(x) { x = Math.min(3, Math.max(-3, x)); return x * (27 + x * x) / (27 + 9 * x * x); }
  noise() {
    let x = this.rng; x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    this.rng = x | 0; return this.rng / 2147483648;
  }
  envelope() {
    const p = this.patch;
    switch (this.stage) {
      case 1: this.env += this.atk; if (this.env >= 1) { this.env = 1; this.stage = 2; } break;
      case 2:
        this.env = p.sustain + (this.env - p.sustain) * this.decayC;
        if (Math.abs(this.env - p.sustain) < 1e-3) this.stage = 3;
        break;
      case 3:
        this.env = p.sustain;
        // A sustain of zero is a pluck: over even with the gate held.
        if (this.env <= 1e-4) { this.active = false; this.stage = 0; }
        break;
      case 4:
        this.env *= this.relC;
        if (this.env < 1e-4) { this.env = 0; this.active = false; this.stage = 0; }
        break;
    }
  }
  process(lfo, cutoff, res, envScale) {
    if (!this.active || !this.patch) return 0;
    if (this.gate > 0 && --this.gate === 0) this.noteOff();
    this.envelope();
    if (!this.active) return 0;
    const p = this.patch, B = JunoVoice.blep, dt = this.inc, sr = this.sr;
    const wrap = (x) => (x >= 1 ? x - 1 : x);
    const width = Math.min(0.95, Math.max(0.05, p.pulseWidth + lfo * p.pwmDepth * 0.4));
    const saw = (2 * this.phase - 1) - B(this.phase, dt);
    let pulse = this.phase < width ? 1 : -1;
    pulse += B(this.phase, dt);
    pulse -= B(wrap(this.phase + 1 - width), dt);
    let sub = this.subPhase < 0.5 ? 1 : -1;
    sub += B(this.subPhase, dt * 0.5);
    sub -= B(wrap(this.subPhase + 0.5), dt * 0.5);
    const n = this.noise();
    const mixTotal = Math.max(1, p.saw + p.pulse + p.sub + p.noise);
    let x = (saw * p.saw + pulse * p.pulse + sub * p.sub + n * p.noise) / mixTotal;
    this.phase += dt; if (this.phase >= 1) this.phase -= 1;
    this.subPhase += dt * 0.5; if (this.subPhase >= 1) this.subPhase -= 1;
    // The Juno's own HPF, a gentle one-pole that thins the bottom.
    this.hpLow += this.hpfC * (x - this.hpLow);
    x -= this.hpLow;
    // Ten octaves across the slider; envelope and key follow in the same units.
    const pos = Math.min(1, Math.max(0, cutoff + p.envAmount * this.env * envScale
                                          + p.keyTrack * (this.note - 60) / 120));
    const hz = Math.min(20 * Math.pow(2, pos * 10), 0.45 * sr);
    const g = Math.tan(Math.PI * hz / sr), G = g / (1 + g);
    const k = Math.min(1, Math.max(0, res)) * 3.85;
    const S = (G * G * G * this.s1 + G * G * this.s2 + G * this.s3 + this.s4) / (1 + g);
    const u = JunoVoice.softClip((x - k * S) / (1 + k * G * G * G * G));
    let v = (u - this.s1) * G; const y1 = v + this.s1; this.s1 = y1 + v;
    v = (y1 - this.s2) * G;    const y2 = v + this.s2; this.s2 = y2 + v;
    v = (y2 - this.s3) * G;    const y3 = v + this.s3; this.s3 = y3 + v;
    v = (y3 - this.s4) * G;    const y4 = v + this.s4; this.s4 = y4 + v;
    // A ladder loses passband as resonance rises; give some of it back.
    return y4 * (1 + k * 0.5) * this.env * this.vel * p.level;
  }
}

/* The J-6's delay: ping-pong, locked to tempo, darker every time round. */
class TempoDelay {
  constructor(sr) {
    this.sr = sr;
    this.L = new Float32Array(Math.floor(sr * 2.5) + 4);
    this.R = new Float32Array(this.L.length);
    this.w = 0; this.lowL = 0; this.lowR = 0;
    this.target = sr * 0.5; this.current = this.target;
    this.send = 0; this.fb = 0.3;
  }
  /* Division 0 eighth, 1 dotted eighth, 2 quarter. */
  setTiming(bpm, division) {
    const beats = [0.5, 0.75, 1.0][Math.min(2, Math.max(0, division))];
    this.target = Math.min(60 / Math.max(40, bpm) * beats * this.sr, this.L.length - 4);
  }
  setAmount(send, fb) { this.send = Math.min(1, Math.max(0, send)); this.fb = Math.min(0.85, Math.max(0, fb)); }
  read(line, d) {
    const size = line.length;
    let pos = this.w - d;
    while (pos < 0) pos += size;
    const a = pos | 0, b = (a + 1) % size, fr = pos - a;
    return line[a] * (1 - fr) + line[b] * fr;
  }
  process(io) {
    // A tempo change bends the repeats for a moment instead of clicking.
    this.current += (this.target - this.current) * 0.0005;
    const wl = this.read(this.L, this.current), wr = this.read(this.R, this.current);
    this.lowL += 0.35 * (wl - this.lowL);
    this.lowR += 0.35 * (wr - this.lowR);
    const input = (io[0] + io[1]) * 0.5 * this.send;
    // Ping-pong: each echo lands on the opposite side from the last.
    this.L[this.w] = input + this.lowR * this.fb;
    this.R[this.w] = this.lowL * this.fb;
    if (++this.w >= this.L.length) this.w = 0;
    io[0] += wl; io[1] += wr;
  }
}

/* The chord generator: a chord from the keys, a way of playing it from the
   plate, six Juno voices to play it on. Voice leading picks the inversion that
   moves least; every phrase shares one beat grid, so changing style mid-bar
   keeps the beat and changes only what lands on it. */
class JunoEngine {
  constructor(sr) {
    this.sr = sr;
    this.voices = [];
    for (let i = 0; i < 6; i++) this.voices.push(new JunoVoice(sr));
    this.patchIndex = 0; this.setPatch(0);
    this.bpm = 96; this.bps = this.bpm / 60 / sr; this.beatPos = 0;
    this.cutoff = 0; this.res = 0; this.lfoPhase = 0;
    this.root = 0; this.func = 0; this.ext = false; this.genre = 0;
    this.voiced = []; this.bassOn = false; this.octave = 0;
    this.playing = false; this.hold = false; this.strumUp = true;
    this.style = 0; this.lastStyle = 0; this.lastStep = -1;
    this.arpIndex = -1; this.arpDir = 1; this.contour = 0;
    this.intensity = 0.8;
    this.variations = [0, 0, 0, 0, 0, 0, 0, 0];
    this.order = 0;
    this.strum = [];
    this.beat = -1;
    this.leadVoicing();
  }

  /* name, saw, pulse, sub, noise, pw, pwm, lfo, env, key, hpf, A, D, S, R, level, delay send, feedback, division */
  static patches() {
    if (!JunoEngine._patches) {
      const row = (name, saw, pulse, sub, noise, pulseWidth, pwmDepth, lfoRate, envAmount, keyTrack, hpf,
                   attack, decay, sustain, release, level, delaySend, delayFeedback, delayDivision) =>
        ({ name, saw, pulse, sub, noise, pulseWidth, pwmDepth, lfoRate, envAmount, keyTrack, hpf,
           attack, decay, sustain, release, level, delaySend, delayFeedback, delayDivision });
      JunoEngine._patches = [
        row('PAD',     0.80, 0.45, 0.30, 0, 0.50, 0.35, 0.45, 0.22, 0.30, 0.05, 0.55,  1.20, 0.80, 1.40, 0.55, 0.18, 0.35, 1),
        row('STRÅKAR', 1.00, 0.00, 0.15, 0, 0.50, 0.00, 0.40, 0.10, 0.30, 0.20, 0.35,  1.00, 0.90, 1.00, 0.50, 0.10, 0.30, 2),
        row('STÖT',    0.90, 0.25, 0.40, 0, 0.50, 0.10, 0.80, 0.60, 0.40, 0.05, 0.003, 0.25, 0.30, 0.18, 0.70, 0.30, 0.42, 1),
        row('PLOCK',   0.20, 0.80, 0.20, 0, 0.30, 0.10, 0.60, 0.70, 0.40, 0.08, 0.002, 0.35, 0.00, 0.30, 0.75, 0.26, 0.45, 0),
        row('BRASS',   1.00, 0.00, 0.20, 0, 0.50, 0.00, 0.50, 0.55, 0.35, 0.05, 0.06,  0.50, 0.70, 0.35, 0.60, 0.12, 0.30, 2)
      ];
    }
    return JunoEngine._patches;
  }

  static genres() { return ['POP', 'SYNTHWAVE', 'HOUSE', 'NEO SOUL', 'GOSPEL', 'LOFI']; }

  /* [genre][function][plain, extended] as [suffix, intervals]. Functions are
     0 major, 1 minor, 2 dominant, 3 half-diminished. Read across a row to hear a genre. */
  static shape(genre, func, ext) {
    if (!JunoEngine._shapes) JunoEngine._shapes = [
      [ [['add9', [0, 4, 7, 14]], ['maj9', [0, 4, 7, 11, 14]]],          // POP
        [['m7', [0, 3, 7, 10]], ['m9', [0, 3, 7, 10, 14]]],
        [['add9', [0, 4, 7, 14]], ['9sus4', [0, 5, 7, 10, 14]]],
        [['m7b5', [0, 3, 6, 10]], ['m7b5', [0, 3, 6, 10, 12]]] ],
      [ [['sus2', [0, 2, 7, 12]], ['add9', [0, 4, 7, 12, 14]]],          // SYNTHWAVE
        [['madd9', [0, 3, 7, 14]], ['m9', [0, 3, 7, 10, 14]]],
        [['sus2', [0, 2, 7, 12]], ['7sus4', [0, 5, 7, 10, 12]]],
        [['m7b5', [0, 3, 6, 10]], ['m7b5', [0, 3, 6, 10, 12]]] ],
      [ [['maj7', [0, 4, 7, 11]], ['maj9', [0, 4, 7, 11, 14]]],          // HOUSE
        [['m7', [0, 3, 7, 10]], ['m11', [0, 3, 7, 10, 17]]],
        [['7sus4', [0, 5, 7, 10]], ['9sus4', [0, 5, 7, 10, 14]]],
        [['m7b5', [0, 3, 6, 10]], ['m7b5', [0, 3, 6, 10, 12]]] ],
      [ [['maj9', [0, 4, 7, 11, 14]], ['maj9#11', [0, 4, 11, 14, 18]]],  // NEO SOUL
        [['m9', [0, 3, 7, 10, 14]], ['m11', [0, 3, 10, 14, 17]]],
        [['13', [0, 4, 10, 14, 21]], ['7#9', [0, 4, 7, 10, 15]]],
        [['m9b5', [0, 3, 6, 10, 14]], ['m11b5', [0, 3, 6, 10, 17]]] ],
      [ [['maj7', [0, 4, 7, 11]], ['6/9', [0, 4, 7, 9, 14]]],            // GOSPEL
        [['m7', [0, 3, 7, 10]], ['m9', [0, 3, 7, 10, 14]]],
        [['9sus4', [0, 5, 7, 10, 14]], ['7#9', [0, 4, 7, 10, 15]]],
        [['m7b5', [0, 3, 6, 10]], ['dim7', [0, 3, 6, 9]]] ],
      [ [['maj7', [0, 4, 7, 11]], ['maj9', [0, 4, 7, 11, 14]]],          // LOFI
        [['m9', [0, 3, 7, 10, 14]], ['m11', [0, 3, 10, 14, 17]]],
        [['9', [0, 4, 7, 10, 14]], ['13', [0, 4, 10, 14, 21]]],
        [['m7b5', [0, 3, 6, 10]], ['m9b5', [0, 3, 6, 10, 14]]] ]
    ];
    const g = ((genre % 6) + 6) % 6;
    return JunoEngine._shapes[g][func][ext ? 1 : 0];
  }

  /* Eight styles, four variations each, organised by mechanism as the J-6 does:
     [name, mode, stepsPerBeat, beats, hits (-1 every step), gate in steps,
      arp direction, strum spread ms, melody contour, alternate strum]. */
  static styles() {
    if (!JunoEngine._styles) {
      const at = (...s) => s.reduce((m, x) => (m | (1 << x)) >>> 0, 0);
      const E = 0xffffffff;
      const V = (name, mode, spb, beats, hits, gate, dir = 0, strumMs = 0, contour = null, alternate = false) =>
        ({ name, mode, spb, beats, hits, gate, dir, strumMs, contour, alternate });
      JunoEngine._styles = [
        { name: 'PULS', v: [
          V('HEL', 'hold', 1, 4, 0, 0), V('HALV', 'pulse', 1, 2, at(0), 1.85),
          V('FJÄRDEDEL', 'pulse', 1, 1, at(0), 0.85), V('ÅTTONDEL', 'pulse', 2, 1, at(0, 1), 0.80) ] },
        { name: 'ARP 1/8', v: [
          V('UPP', 'arp', 2, 1, E, 0.9, 1), V('NED', 'arp', 2, 1, E, 0.9, -1),
          V('UPP/NED', 'arp', 2, 1, E, 0.9, 0), V('TRIOL', 'arp', 3, 1, E, 0.9, 1) ] },
        { name: 'ARP 1/16', v: [
          V('UPP', 'arp', 4, 1, E, 0.85, 1), V('NED', 'arp', 4, 1, E, 0.85, -1),
          V('UPP/NED', 'arp', 4, 1, E, 0.85, 0), V('TRIOL', 'arp', 6, 1, E, 0.85, 1) ] },
        { name: 'RYTM', v: [
          V('o_o_', 'pulse', 4, 1, at(0, 2), 0.90), V('__o_', 'pulse', 4, 1, at(2), 0.80),
          V('oo_o', 'pulse', 4, 1, at(0, 1, 3), 0.70), V('o__o', 'pulse', 4, 1, at(0, 3), 0.90) ] },
        { name: 'SYNKOP', v: [
          V('3-3-2', 'pulse', 4, 2, at(0, 3, 6), 1.20), V('3-2-3', 'pulse', 4, 2, at(0, 3, 5), 1.00),
          V('KNUFF', 'pulse', 4, 2, at(1, 3, 6), 0.90), V('STUDS', 'pulse', 4, 2, at(0, 2, 5, 7), 0.80) ] },
        { name: 'STRUM', v: [
          V('ENKEL', 'strum', 1, 4, at(0), 3.80, 0, 28), V('RYTMISK', 'strum', 2, 2, at(0, 3), 1.40, 0, 22, null, true),
          V('SNABB', 'strum', 1, 1, at(0), 0.90, 0, 12), V('LÅNGSAM', 'strum', 1, 4, at(0), 3.80, 0, 70) ] },
        { name: 'GATE', v: [
          V('1/16', 'pulse', 4, 1, E, 0.45), V('HACKA', 'pulse', 4, 2, at(0, 1, 3, 4, 5, 7), 0.45),
          V('1/32', 'pulse', 8, 1, E, 0.45), V('PUNKT', 'pulse', 4, 4, at(0, 3, 6, 9, 12), 0.50) ] },
        { name: 'FRAS', v: [
          V('ENKEL', 'melody', 2, 4, E, 0.90, 0, 0, [0, 1, 2, 3, 4, 3, 2, 1]),
          V('RYTMISK', 'melody', 4, 2, at(0, 3, 6), 1.30, 0, 0, [3, 2, 4, 3, 2, 4, 3, 2]),
          V('STIGANDE', 'melody', 4, 1, E, 0.90, 0, 0, [0, 2, 1, 3, 2, 4, 3, 5]),
          V('TOPP', 'melody', 2, 2, at(0, 1, 3), 1.20, 0, 0, [4, 3, 2, 4, 3, 2, 4, 3]) ] }
      ];
    }
    return JunoEngine._styles;
  }

  /* Where the two filter controls land: cutoff linear, resonance tapered so the
     range sits where the finger is, and short of self-oscillation at the top. */
  static sweep(c, r) {
    return { cutoff: Math.min(1, Math.max(0, c)), res: 0.95 * Math.pow(Math.min(1, Math.max(0, r)), 0.6) };
  }

  get patch() { return JunoEngine.patches()[this.patchIndex]; }
  setPatch(i) {
    this.patchIndex = ((i % 5) + 5) % 5;
    for (const v of this.voices) v.setPatch(JunoEngine.patches()[this.patchIndex]);
  }
  setTempo(bpm) { this.bpm = Math.min(220, Math.max(40, bpm)); this.bps = this.bpm / 60 / this.sr; }
  setFilter(c, r) { const s = JunoEngine.sweep(c, r); this.cutoff = s.cutoff; this.res = s.res; }

  setChord(root, func, ext, genre) {
    root = ((root % 12) + 12) % 12;
    if (root === this.root && func === this.func && ext === this.ext && genre === this.genre && this.voiced.length) return;
    this.root = root; this.func = func; this.ext = ext; this.genre = genre;
    this.leadVoicing();
    if (this.playing) this.followChord();
  }
  setBass(on) { if (on === this.bassOn) return; this.bassOn = on; if (this.playing) this.followChord(); }

  /* Every inversion, lifted only from the bottom, with its lowest note between
     D3 and D4. The one that moves least from the last chord wins. */
  leadVoicing() {
    const iv = JunoEngine.shape(this.genre, this.func, this.ext)[1];
    let best = null, bestCost = 1e9;
    for (let inv = 0; inv < iv.length; inv++) {
      const c = iv.map((x, i) => x + (i < inv ? 12 : 0)).sort((a, b) => a - b);
      let root = 36 + this.root;
      while (root + c[0] < 50) root += 12;
      while (root + c[0] >= 62) root -= 12;
      for (let i = 0; i < c.length; i++) c[i] += root;
      const cost = this.voicingCost(c);
      if (cost < bestCost) { bestCost = cost; best = c; }
    }
    this.voiced = best;
  }
  voicingCost(c) {
    const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    const centre = mean(c);
    if (!this.voiced.length) return Math.abs(centre - 64);
    let movement = 0;
    for (const n of c) {
      let nearest = 128;
      for (const p of this.voiced) nearest = Math.min(nearest, Math.abs(n - p));
      movement += nearest;
    }
    // Drift of the whole shape counts double: small moves that walk upwards are still a walk.
    return movement + 2 * Math.abs(centre - mean(this.voiced));
  }
  bassNote() {
    let n = 36 + this.root + 12 * this.octave;
    while (n > 52) n -= 12;
    while (n < 24) n += 12;
    return n;
  }
  targets() {
    const t = this.voiced.map((n) => n + 12 * this.octave);
    if (this.bassOn) t.push(this.bassNote());
    return t;
  }

  /* Notes that belong to the new chord keep sounding; the rest let go. A held
     pad then fills in what is new, so a progression on it is legato. */
  followChord() {
    const t = this.targets();
    for (const v of this.voices) if (v.gateOn && !t.includes(v.note)) v.noteOff();
    if (this.playing && this.modeOf(this.style) === 'hold') this.strikeHeld();
  }

  variation(style) { return JunoEngine.styles()[style].v[this.variations[style]]; }
  modeOf(style) { return this.variation(style).mode; }

  /* The plate: which style and variation the finger is on, or -1 for lifted. */
  setPhrase(style, variation) {
    if (style < 0) { if (this.playing && !this.hold) this.stop(); return; }
    this.lastStyle = style;
    if (!this.playing) { this.variations[style] = variation; this.start(style); return; }
    if (style !== this.style) {
      const before = this.modeOf(this.style);
      this.variations[style] = variation;
      this.style = style;
      this.changeMode(before, this.modeOf(style));
    } else if (variation !== this.variations[style]) {
      const before = this.modeOf(style);
      this.variations[style] = variation;
      this.changeMode(before, this.modeOf(style));
    }
  }
  setHold(on) { this.hold = on; }

  start(style) {
    this.playing = true; this.style = style;
    this.beatPos = 0; this.lastStep = -1;
    this.arpIndex = -1; this.arpDir = 1; this.contour = 0; this.strumUp = true;
    if (this.modeOf(style) === 'hold') this.strikeHeld();
  }
  /* Leaving a held pad lets it go; arriving at one strikes it. The beat is kept. */
  changeMode(before, after) {
    this.lastStep = this.absoluteStep();
    if (before === 'hold' && after !== 'hold') this.releaseAll();
    if (after === 'hold' && before !== 'hold') this.strikeHeld();
  }
  stop() { this.playing = false; this.strum.length = 0; this.releaseAll(); this.beat = -1; }
  allOff() { this.hold = false; this.stop(); }

  /* Steps counted from the start of the phrase, not within the figure. A figure
     one step long (FJÄRDEDEL, STRUM SNABB) is on step 0 for ever, so comparing
     the step within the figure saw nothing new after the first hit. */
  absoluteStep() {
    return Math.floor(this.beatPos * this.variation(this.style).spb);
  }
  samplesPerStep(v) { return Math.max(1, Math.floor(this.sr * 60 / (this.bpm * v.spb))); }

  tick() {
    const v = this.variation(this.style);
    if (v.mode === 'hold') return;
    const abs = this.absoluteStep();
    if (abs === this.lastStep) return;
    this.lastStep = abs;
    const step = abs % (v.spb * v.beats);
    if (((v.hits >>> step) & 1) !== 0) this.fire(v, step);
  }

  fire(v, step) {
    // The downbeat of every beat is struck a little harder: that is the groove.
    const onBeat = step % v.spb === 0;
    const vel = (0.35 + 0.65 * this.intensity) * (onBeat ? 1 : 0.82);
    const sps = this.samplesPerStep(v);
    const gate = Math.max(1, Math.floor(v.gate * sps));
    if (this.bassOn && onBeat) this.play(this.bassNote(), vel, Math.max(gate, sps * v.spb));
    switch (v.mode) {
      case 'pulse': for (const n of this.voiced) this.play(n + 12 * this.octave, vel, gate); break;
      case 'arp': this.play(this.nextArp(v.dir), vel, gate); break;
      case 'melody': this.play(this.toneAt(v.contour[this.contour++ % 8]), vel, gate); break;
      case 'strum': this.scheduleStrum(v, vel, gate); break;
    }
  }

  /* The voicing and the same an octave up, walked in the arp's direction. */
  nextArp(dir) {
    const n = this.voiced.length * 2;
    if (dir > 0) this.arpIndex = (this.arpIndex + 1) % n;
    else if (dir < 0) this.arpIndex = this.arpIndex <= 0 ? n - 1 : this.arpIndex - 1;
    else {
      this.arpIndex += this.arpDir;
      if (this.arpIndex >= n) { this.arpIndex = n - 2; this.arpDir = -1; }
      if (this.arpIndex < 0) { this.arpIndex = Math.min(1, n - 1); this.arpDir = 1; }
    }
    return this.toneAt(this.arpIndex);
  }
  toneAt(index) {
    const c = this.voiced.length, i = Math.max(0, index);
    return this.voiced[i % c] + 12 * Math.floor(i / c) + 12 * this.octave;
  }

  scheduleStrum(v, vel, gate) {
    const spacing = Math.floor(v.strumMs * 0.001 * this.sr);
    const c = this.voiced.length;
    for (let i = 0; i < c; i++) {
      const which = this.strumUp ? i : c - 1 - i;
      // Later notes in a strum are a little softer and shorter, as under a hand.
      this.strum.push({ note: this.voiced[which] + 12 * this.octave, vel: vel * (1 - 0.05 * i),
                        gate: Math.max(1, gate - i * spacing), delay: i * spacing });
    }
    if (v.alternate) this.strumUp = !this.strumUp;
  }
  tickStrum() {
    for (let i = 0; i < this.strum.length;) {
      const s = this.strum[i];
      if (s.delay-- > 0) { i++; continue; }
      this.play(s.note, s.vel, s.gate);
      this.strum[i] = this.strum[this.strum.length - 1];
      this.strum.pop();
    }
  }

  strikeHeld() {
    const vel = 0.35 + 0.65 * this.intensity;
    for (const n of this.targets())
      if (!this.voices.some((v) => v.gateOn && v.note === n)) this.play(n, vel, 0);
  }
  releaseAll() { for (const v of this.voices) if (v.gateOn) v.noteOff(); }

  /* The same note takes its voice back; then a free voice; then the oldest
     released one; only then something still held. */
  play(note, vel, gate) {
    note = Math.min(127, Math.max(0, note));
    let chosen = this.voices.find((v) => v.active && v.note === note);
    if (!chosen) chosen = this.voices.find((v) => !v.active);
    for (let pass = 0; pass < 2 && !chosen; pass++) {
      let oldest = Infinity;
      for (const v of this.voices) {
        if ((pass === 0 && v.gateOn) || v.stamp >= oldest) continue;
        oldest = v.stamp; chosen = v;
      }
    }
    if (chosen) chosen.noteOn(note, vel, gate, ++this.order);
  }

  process() {
    this.lfoPhase += this.patch.lfoRate / this.sr;
    if (this.lfoPhase >= 1) this.lfoPhase -= 1;
    const lfo = Math.sin(2 * Math.PI * this.lfoPhase);
    if (this.playing) {
      this.beatPos += this.bps;
      this.tick();
      this.beat = Math.floor(this.beatPos);
    }
    if (this.strum.length) this.tickStrum();
    const envScale = 0.4 + 0.6 * this.intensity;
    let sum = 0;
    for (let i = 0; i < 6; i++) sum += this.voices[i].process(lfo, this.cutoff, this.res, envScale);
    return sum * 0.24;
  }
}

/* The instrument: a 48-voice pool, the plate's notes, and a queue of plucks
   placed on the sample they were scheduled for. */
class OmniDSP {
  constructor(sr) {
    this.sr = sr;
    this.voices = [];
    for (let i = 0; i < 48; i++) this.voices.push(new PluckVoice(sr));
    this.ens = new Ensemble(sr);
    this.verb = new Freeverb(sr);
    this.notes = [];
    this.queue = [];
    this.stamp = 0;
    this.chorus = true;
    this.setVoice(0);
    this.frame = [0, 0];
    this.comp = new Comp(sr);
    this.lastBeat = -1;
    // The Juno, with its own chorus setting and the J-6's delay.
    this.inst = 'omni';
    this.juno = new JunoEngine(sr);
    this.ensJ = new Ensemble(sr);
    this.delay = new TempoDelay(sr);
    this.jframe = [0, 0];
  }

  /* The four timbres from VoiceSpec.h, as data. The decay scale multiplies the
     four-second ring Chordtroller has with LT released, so vibes ring longest and
     the guitar shortest. */
  static voiceSpecs() {
    return [
      { name: 'OMNI',     wave: 'pulse', width: 0.35, filter: 7,  decayScale: 1.00, attack: 0.0020, detune: 3 },
      { name: 'HARPA',    wave: 'saw',   width: 0,    filter: 5,  decayScale: 1.15, attack: 0.0030, detune: 2 },
      { name: 'VIBRAFON', wave: 'sine',  width: 0,    filter: 12, decayScale: 1.60, attack: 0.0040, detune: 1.5 },
      { name: 'GITARR',   wave: 'pulse', width: 0.20, filter: 9,  decayScale: 0.70, attack: 0.0015, detune: 4 }
    ];
  }

  setVoice(i) {
    this.spec = OmniDSP.voiceSpecs()[i] || OmniDSP.voiceSpecs()[0];
    this.decay = Math.pow(0.001, 1 / (this.sr * 4 * this.spec.decayScale));
    // Notes already ringing take the new length too.
    for (const v of this.voices) if (v.active) v.decay = this.decay;
  }

  setJuno(m) {
    const j = this.juno;
    if (m.patch !== j.patchIndex) j.setPatch(m.patch);
    j.setFilter(m.cutoff, m.resonance);
    j.setBass(m.bass);
    j.setHold(m.hold);
    j.setTempo(m.bpm);
    // Chorus I and II are two speeds of one bucket brigade; I+II is the widest.
    this.ensJ.rate = [0.50, 0.52, 0.83, 1.20][m.chorus];
    this.ensJ.mix = [0.00, 0.50, 0.50, 0.58][m.chorus];
    const p = j.patch;
    this.delay.setTiming(j.bpm, p.delayDivision);
    this.delay.setAmount(p.delaySend, p.delayFeedback);
  }

  message(m) {
    if (m.type === 'chord') this.notes = m.notes;
    else if (m.type === 'pluck') this.queue.push({ s: m.string, v: m.vel, w: Math.round(m.delay * this.sr), done: false });
    else if (m.type === 'fx') { this.chorus = m.chorus; this.verb.on = m.reverb; }
    else if (m.type === 'compChord') this.comp.setChord(m);
    else if (m.type === 'rhythm') this.comp.configure(m);
    else if (m.type === 'hold') this.comp.setHold(m.on);
    else if (m.type === 'voice') this.setVoice(m.index);
    else if (m.type === 'instrument') { this.inst = m.name; if (m.name !== 'juno') this.juno.allOff(); }
    else if (m.type === 'junoChord') this.juno.setChord(m.root, m.func, m.ext, m.genre);
    else if (m.type === 'junoParams') this.setJuno(m);
    else if (m.type === 'phrase') this.juno.setPhrase(m.style, m.variation);
  }

  /* The beat the rhythm last landed on, once per change, for the tempo light. */
  takeBeat() {
    const b = this.inst === 'juno' ? this.juno.beat : this.comp.beat;
    if (b === this.lastBeat) return -1;
    this.lastBeat = b;
    return b;
  }

  // A ringing string takes its own note back; then a free voice; then the oldest.
  alloc(s) {
    for (const v of this.voices) if (v.active && v.string === s) return v;
    for (const v of this.voices) if (!v.active) return v;
    let oldest = this.voices[0];
    for (const v of this.voices) if (v.stamp < oldest.stamp) oldest = v;
    return oldest;
  }

  trigger(s, vel) {
    const note = this.notes[s];
    if (note === undefined) return;
    const freq = 440 * Math.pow(2, (note - 69) / 12);
    this.alloc(s).start(freq, vel, this.decay, this.spec, s, ++this.stamp);
  }

  process(L, R, n) {
    const q = this.queue, fr = this.frame;
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < q.length; k++) {
        const it = q[k];
        if (!it.done && it.w <= i) { this.trigger(it.s, it.v); it.done = true; }
      }
      let sum = 0;
      for (let k = 0; k < 48; k++) { const v = this.voices[k]; if (v.active) sum += v.process(); }
      const dry = sum * 0.07;
      if (this.chorus) this.ens.process(dry, fr);
      else { this.ens.process(dry, fr); fr[0] = fr[1] = dry; }
      // The accompaniment skips the chorus, as the comp does in Chordtroller: the
      // chorus would wash the bass into mush. It meets the strings at the room.
      const comp = this.comp.process() * 0.21;
      fr[0] += comp; fr[1] += comp;
      // Juno: voices, then its chorus, then the delay, then the shared room,
      // the J-6's signal flow.
      const jf = this.jframe;
      this.ensJ.process(this.juno.process() * 0.9, jf);
      this.delay.process(jf);
      fr[0] += jf[0]; fr[1] += jf[1];
      this.verb.process(fr);
      L[i] = Math.tanh(fr[0]);
      R[i] = Math.tanh(fr[1]);
    }
    if (q.length) {
      this.queue = q.filter((it) => !it.done);
      for (const it of this.queue) it.w -= n;
    }
  }
}

/* =============================================================================
   Music — ported from Source/music/ChordRing.h (StringSet).
   ============================================================================= */

const PC_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const PC_SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

const QUALITIES = {
  maj:  { suffix: '',     third: 4, colour: 7 },
  min:  { suffix: 'm',    third: 3, colour: 7 },
  dim:  { suffix: 'dim',  third: 3, colour: 6 },
  dom7: { suffix: '7',    third: 4, colour: 10 },
  maj7: { suffix: 'maj7', third: 4, colour: 11 },
  min7: { suffix: 'm7',   third: 3, colour: 10 }
};

/* The plate, in the order the plate gives it: root, third, then the colour tone
   dropped an octave below the root, four times over, and a closing root. The
   sweep rolls instead of climbing. See the comment over StringSet in ChordRing.h. */
function buildStrings(pc, quality) {
  const q = QUALITIES[quality];
  const base = pc <= 5 ? 48 + pc : 36 + pc;
  const colourOffset = (base + q.colour - 12) >= 42 ? q.colour - 12 : q.colour;
  const out = [];
  for (let oct = 0; oct < 4; oct++) {
    const root = base + 12 * oct;
    out.push(root, root + q.third, root + colourOffset);
  }
  out.push(base + 48);
  return out;
}

// Sharps on the plate when the key says F#, C# or G#, so the two agree.
const noteName = (m, sharps) => (sharps ? PC_SHARPS : PC_NAMES)[m % 12] + (Math.floor(m / 12) - 1);

/* The OM-84's button order: twelve roots in fifths, Eb at the left. */
const ROOTS = [['Eb', 3], ['Bb', 10], ['F', 5], ['C', 0], ['G', 7], ['D', 2],
               ['A', 9], ['E', 4], ['B', 11], ['F#', 6], ['C#', 1], ['G#', 8]];
const ROWS = [{ cls: 'q0', suffix: '', name: 'dur' },
              { cls: 'q1', suffix: 'm', name: 'moll' },
              { cls: 'q2', suffix: '7', name: 'sept' }];

/* =============================================================================
   Audio plumbing
   ============================================================================= */

let ctx = null, node = null, dsp = null, ready = false;
const pending = [];
const fx = { chorus: true, reverb: true, chord: true, bass: true };
const rhythm = { running: false, pattern: 'rock', bpm: 96 };
let inst = 'omni';
const junoState = { genre: 0, patch: 0, chorus: 1, bass: true, ext: false, hold: false, cutoff: 0.6, resonance: 0.15 };
let phrase = null;   // { style, variation } under the finger, or held
let current = { r: 3, quality: 'maj', notes: buildStrings(0, 'maj') };

function send(m) {
  if (!ready) { if (m.type !== 'pluck') pending.push(m); return; }
  if (node && node.port) node.port.postMessage(m); else if (dsp) dsp.message(m);
}

function workletSource() {
  return [PluckVoice, Ensemble, CompVoice, DrumKit, Comp, Freeverb, JunoVoice, TempoDelay, JunoEngine, OmniDSP].map((c) => c.toString()).join('\n') + `
class OmniProcessor extends AudioWorkletProcessor {
  constructor() { super(); this.dsp = new OmniDSP(sampleRate); this.port.onmessage = (e) => this.dsp.message(e.data); }
  process(inputs, outputs) {
    const o = outputs[0];
    this.dsp.process(o[0], o[1] || new Float32Array(o[0].length), o[0].length);
    const b = this.dsp.takeBeat();
    if (b >= 0) this.port.postMessage({ type: 'beat', beat: b });
    return true;
  }
}
registerProcessor('omni', OmniProcessor);`;
}

async function startAudio() {
  if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({ latencyHint: 'interactive' });
  ctx.resume();
  // Older iOS only unlocks output once a buffer has actually played.
  const unlock = ctx.createBufferSource();
  unlock.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
  unlock.connect(ctx.destination); unlock.start(0);

  try {
    const url = URL.createObjectURL(new Blob([workletSource()], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, 'omni', { numberOfInputs: 0, outputChannelCount: [2] });
    node.port.onmessage = (e) => { if (e.data.type === 'beat') showBeat(e.data.beat); };
  } catch (e) {
    // No worklet (or it was blocked): run the same DSP on the main thread.
    dsp = new OmniDSP(ctx.sampleRate);
    node = ctx.createScriptProcessor(512, 0, 2);
    node.onaudioprocess = (ev) => {
      const b = ev.outputBuffer;
      dsp.process(b.getChannelData(0), b.getChannelData(1), b.length);
      const beat = dsp.takeBeat();
      if (beat >= 0) showBeat(beat);
    };
  }
  node.connect(ctx.destination);
  ready = true;
  send({ type: 'chord', notes: current.notes });
  send({ type: 'fx', chorus: fx.chorus, reverb: fx.reverb });
  pending.length = 0;
  sendCompChord();
  sendRhythm();
  send({ type: 'voice', index: +document.getElementById('voice').value });
  send({ type: 'instrument', name: inst });
  sendJunoParams();
  sendJunoChord();
  updateChordSound();
  ctx.onstatechange = updatePower;
  updatePower();
}

const powerBtn = document.getElementById('power');
function updatePower() { powerBtn.hidden = !!ctx && ctx.state === 'running'; }
powerBtn.addEventListener('click', startAudio);
// Touch only counts as a user gesture on release, so unlock there.
document.addEventListener('pointerup', () => { if (!ctx || ctx.state !== 'running') startAudio(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && ctx.state !== 'running') ctx.resume(); });

for (const [id, key] of [['chordToggle', 'chord'], ['bassToggle', 'bass'], ['chorusToggle', 'chorus'], ['reverbToggle', 'reverb']]) {
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    fx[key] = !fx[key];
    b.setAttribute('aria-pressed', String(fx[key]));
    if (key === 'chord' || key === 'bass') sendRhythm();
    else send({ type: 'fx', chorus: fx.chorus, reverb: fx.reverb });
  });
}

/* ---------- rhythm ---------- */

function sendRhythm() {
  send({ type: 'rhythm', running: rhythm.running, pattern: rhythm.pattern, bpm: rhythm.bpm,
         chordOn: fx.chord, bassOn: fx.bass });
}

const startBtn = document.getElementById('startStop');
const patternSel = document.getElementById('pattern');
const bpmOut = document.getElementById('bpm');
const beatLed = document.getElementById('beatLed');

startBtn.addEventListener('click', () => {
  rhythm.running = !rhythm.running;
  startBtn.setAttribute('aria-pressed', String(rhythm.running));
  startBtn.textContent = rhythm.running ? 'Stopp' : 'Start';
  sendRhythm();
  if (!rhythm.running) beatLed.classList.remove('on', 'one');
});
patternSel.addEventListener('change', () => { rhythm.pattern = patternSel.value; sendRhythm(); });
document.getElementById('voice').addEventListener('change', (e) => send({ type: 'voice', index: +e.target.value }));

/* ---------- instrument ---------- */

const instSel = document.getElementById('instrument');
function setInstrument(name) {
  inst = name;
  document.body.dataset.inst = name;
  if (name === 'juno' && rhythm.running) startBtn.click();   // the Omni's rhythm stops
  if (name !== 'juno') { phraseFingers.clear(); phrase = null; renderPhrases(); }
  send({ type: 'instrument', name });
  if (name === 'juno') { sendJunoParams(); sendJunoChord(); }
  beatLed.classList.remove('on', 'one');
  updateChordSound();
  renderReadout();
}
instSel.addEventListener('change', () => setInstrument(instSel.value));

/* ---------- Juno controls ---------- */

function sendJunoParams() {
  send({ type: 'junoParams', patch: junoState.patch, cutoff: junoState.cutoff, resonance: junoState.resonance,
         chorus: junoState.chorus, bass: junoState.bass, hold: junoState.hold, bpm: rhythm.bpm });
}

const genreSel = document.getElementById('genre');
JunoEngine.genres().forEach((g, i) => genreSel.add(new Option(g.charAt(0) + g.slice(1).toLowerCase(), i)));
genreSel.addEventListener('change', () => { junoState.genre = +genreSel.value; sendJunoChord(); renderReadout(); });

const patchSel = document.getElementById('patch');
JunoEngine.patches().forEach((p, i) => patchSel.add(new Option(p.name.charAt(0) + p.name.slice(1).toLowerCase(), i)));
patchSel.addEventListener('change', () => { junoState.patch = +patchSel.value; sendJunoParams(); });

document.getElementById('junoChorus').addEventListener('change', (e) => { junoState.chorus = +e.target.value; sendJunoParams(); });

for (const [id, key] of [['junoBassToggle', 'bass'], ['extToggle', 'ext'], ['holdToggle', 'hold']]) {
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    junoState[key] = !junoState[key];
    b.setAttribute('aria-pressed', String(junoState[key]));
    if (key === 'ext') { sendJunoChord(); renderReadout(); return; }
    sendJunoParams();
    // Letting go of HÅLL with no finger on the plate stops the phrase.
    if (key === 'hold' && !junoState.hold && phraseFingers.size === 0) sendPhrase(null);
  });
}

/* A fader is a strip: the finger's position along it is the value. */
function makeFader(id, key) {
  const el = document.getElementById(id);
  const fill = el.querySelector('.fill'), val = el.querySelector('.fval');
  const show = () => {
    const pct = Math.round(junoState[key] * 100);
    fill.style.width = pct + '%';
    val.textContent = pct;
    el.setAttribute('aria-valuenow', String(pct));
  };
  const setFrom = (x) => {
    const r = el.getBoundingClientRect();
    junoState[key] = Math.min(1, Math.max(0, (x - r.left) / r.width));
    show(); sendJunoParams();
  };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.dataset.drag = e.pointerId;
    setFrom(e.clientX);
  });
  el.addEventListener('pointermove', (e) => { if (el.dataset.drag == e.pointerId) setFrom(e.clientX); });
  const end = () => { delete el.dataset.drag; };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 0.02, ArrowUp: 0.02, ArrowLeft: -0.02, ArrowDown: -0.02 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    junoState[key] = Math.min(1, Math.max(0, junoState[key] + d));
    show(); sendJunoParams();
  });
  show();
}
makeFader('cutoffFader', 'cutoff');
makeFader('resFader', 'resonance');
function nudgeTempo(d) {
  rhythm.bpm = Math.min(220, Math.max(40, rhythm.bpm + d));
  bpmOut.textContent = rhythm.bpm;
  sendRhythm();
  sendJunoParams();
}
document.getElementById('tempoDown').addEventListener('click', () => nudgeTempo(-4));
document.getElementById('tempoUp').addEventListener('click', () => nudgeTempo(4));

let beatTimer = 0;
function showBeat(b) {
  if (b < 0) return;
  beatLed.classList.add('on');
  beatLed.classList.toggle('one', b % 4 === 0);
  clearTimeout(beatTimer);
  beatTimer = setTimeout(() => beatLed.classList.remove('on', 'one'), 90);
}

/* =============================================================================
   Chord keys
   ============================================================================= */

const keysEl = document.getElementById('keys');
const chordNameEl = document.getElementById('chordName');
const keyEls = [];

ROOTS.forEach(([label], r) => {
  ROWS.forEach((row, q) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key ' + row.cls;
    b.dataset.r = r; b.dataset.q = q;
    b.setAttribute('aria-label', label + ' ' + row.name);
    b.innerHTML = label + (row.suffix ? '<small>' + row.suffix + '</small>' : '');
    keysEl.appendChild(b);
    keyEls.push(b);
  });
});

const portraitQuery = window.matchMedia('(orientation: portrait)');
function layoutKeys() {
  const portrait = portraitQuery.matches;
  for (const b of keyEls) {
    const r = +b.dataset.r, q = +b.dataset.q;
    b.style.gridColumn = String(portrait ? q + 1 : r + 1);
    b.style.gridRow = String(portrait ? r + 1 : q + 1);
  }
}
layoutKeys();
portraitQuery.addEventListener ? portraitQuery.addEventListener('change', layoutKeys) : portraitQuery.addListener(layoutKeys);

const held = new Map();   // pointerId -> key element

/* Buttons held together in one column combine, the way the OM-84 does it.
   Releasing never changes the chord: the plate keeps the last one played. */
function qualityFrom(rows) {
  const maj = rows.has(0), min = rows.has(1), sev = rows.has(2);
  if (maj && min) return 'dim';
  if (maj && sev) return 'maj7';
  if (min && sev) return 'min7';
  if (min) return 'min';
  if (sev) return 'dom7';
  return 'maj';
}

function selectChord(r) {
  const rows = new Set();
  for (const b of held.values()) if (+b.dataset.r === r) rows.add(+b.dataset.q);
  if (rows.size === 0) rows.add(0);
  const quality = qualityFrom(rows);
  const pc = ROOTS[r][1];
  current = { r, quality, notes: buildStrings(pc, quality), rows };
  send({ type: 'chord', notes: current.notes });
  for (const b of keyEls) b.classList.toggle('lit', +b.dataset.r === r && rows.has(+b.dataset.q));
  renderPlate();
  sendCompChord();
  sendJunoChord();
  renderReadout();
  updateChordSound();
}

/* The Juno reads the keys as functions, the way Chordtroller's ring hands over
   its seventh bank: major, minor, dominant, half-diminished. dur+7 and moll+7
   reach for the genre's extended colour, as LB does; UTÖKAD does it for all. */
const JUNO_FUNCTION = { maj: [0, false], min: [1, false], dom7: [2, false], dim: [3, false],
                        maj7: [0, true], min7: [1, true] };
function junoChord() {
  const [func, combo] = JUNO_FUNCTION[current.quality];
  return { root: ROOTS[current.r][1], func, ext: combo || junoState.ext, genre: junoState.genre };
}
function sendJunoChord() { send({ type: 'junoChord', ...junoChord() }); }

const subNameEl = document.getElementById('subName');
function renderReadout() {
  if (inst === 'juno') {
    const c = junoChord();
    chordNameEl.textContent = ROOTS[current.r][0] + JunoEngine.shape(c.genre, c.func, c.ext)[0];
    subNameEl.textContent = phrase
      ? JunoEngine.styles()[phrase.style].name + ' · ' + JunoEngine.styles()[phrase.style].v[phrase.variation].name
      : 'Håll på plattan';
  } else {
    chordNameEl.textContent = ROOTS[current.r][0] + QUALITIES[current.quality].suffix;
    subNameEl.textContent = '';
  }
}

/* CompEngine's voicing: close root position just under the middle of the plate,
   with sevenths dropping the fifth exactly as the plate does. The bass sits in
   the second octave, where nothing the plate does can reach. */
function chordVoicing(pc, quality) {
  const q = QUALITIES[quality];
  const base = 55 + ((((pc - 55) % 12) + 12) % 12);
  return { chord: [base, base + q.third, base + q.colour], bass: 36 + pc, fifth: 36 + (pc + 7) % 12 };
}

function sendCompChord() {
  send({ type: 'compChord', ...chordVoicing(ROOTS[current.r][1], current.quality) });
}

/* Stopped, the chord section sounds while a chord button is held, the way the
   OM-84's does. Running, the rhythm plays the last chord pressed and the hold
   does nothing. ACKORDLJUD and AUTOBAS switch each half off in both modes. */
let holding = false;
function updateChordSound() {
  const want = held.size > 0 && inst === 'omni';
  if (want !== holding) { holding = want; send({ type: 'hold', on: want }); }
}

keysEl.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.key');
  if (!b) return;
  e.preventDefault();
  held.set(e.pointerId, b);
  b.classList.add('down');
  selectChord(+b.dataset.r);
});
function releaseKey(e) {
  const b = held.get(e.pointerId);
  if (!b) return;
  held.delete(e.pointerId);
  b.classList.remove('down');
  updateChordSound();
}
document.addEventListener('pointerup', releaseKey);
document.addEventListener('pointercancel', releaseKey);

/* =============================================================================
   Strumplate
   ============================================================================= */

const plateEl = document.getElementById('plate');
const STRINGS = 13;
const stringEls = [];
for (let i = 0; i < STRINGS; i++) {
  const s = document.createElement('div');
  s.className = 'string';
  s.innerHTML = '<span class="glow"></span><span class="note"></span>';
  plateEl.appendChild(s);   // column-reverse: string 0 sits at the bottom
  stringEls.push(s);
}

function renderPlate() {
  current.notes.forEach((m, i) => {
    const el = stringEls[i];
    el.querySelector('.note').textContent = noteName(m, ROOTS[current.r][0].includes('#'));
    el.classList.toggle('root', i % 3 === 0);
  });
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flash(i, vel) {
  const g = stringEls[i].firstChild;
  if (g.animate) g.animate([{ opacity: 0.35 + 0.65 * vel }, { opacity: 0 }],
                           { duration: reduceMotion ? 180 : 700, easing: 'cubic-bezier(.2,.7,.3,1)' });
}

function pluck(i, vel, delay) {
  send({ type: 'pluck', string: i, vel, delay });
  flash(i, vel);
}

/* Position on the plate, in strings, with string 0 at the bottom. */
function plateCoord(clientY) {
  const r = plateEl.getBoundingClientRect();
  const f = 1 - (clientY - r.top) / r.height;
  return Math.min(STRINGS - 0.0001, Math.max(0, f * STRINGS));
}

/* A finger resting on a line must not chatter, so it has to cross a little past
   the line before the next string counts. Same idea as the stick's sector hysteresis. */
const HYST = 0.18;
const fingers = new Map();   // pointerId -> { idx, t }

plateEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { plateEl.setPointerCapture(e.pointerId); } catch (err) {}
  const idx = Math.floor(plateCoord(e.clientY));
  fingers.set(e.pointerId, { idx, t: e.timeStamp });
  pluck(idx, 0.9, 0);
});

plateEl.addEventListener('pointermove', (e) => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const pos = plateCoord(e.clientY);
  if (pos >= f.idx - HYST && pos < f.idx + 1 + HYST) return;
  const next = Math.floor(pos);
  const dir = next > f.idx ? 1 : -1;
  const n = Math.abs(next - f.idx);
  const dt = Math.max(1, e.timeStamp - f.t);
  // A fast sweep plucks lighter, as in strumVelocity().
  const speed = n / (dt / 1000);
  const vel = Math.min(1, Math.max(0.3, 1 - 0.35 * Math.min(1, speed / 40)));
  // Strings crossed within one move event are spread over the time it covered.
  const span = Math.min(dt, 30) / 1000;
  for (let k = 1; k <= n; k++) pluck(f.idx + dir * k, vel, span * (k - 1) / n);
  f.idx = next; f.t = e.timeStamp;
});

function liftFinger(e) { fingers.delete(e.pointerId); }
plateEl.addEventListener('pointerup', liftFinger);
plateEl.addEventListener('pointercancel', liftFinger);

/* =============================================================================
   Juno phrase plate: eight styles down, four variations across. Holding a finger
   on a style plays it; sliding changes style or variation on the same beat;
   lifting stops it unless HÅLL is on.
   ============================================================================= */

const phrasesEl = document.getElementById('phrases');
const phraseRows = [];
JunoEngine.styles().forEach((st, si) => {
  const row = document.createElement('div');
  row.className = 'prow';
  row.innerHTML = '<span class="pname">' + st.name + '</span>' +
    st.v.map((v) => '<span class="pcell">' + v.name + '</span>').join('');
  phrasesEl.appendChild(row);
  phraseRows.push(row);
});

function renderPhrases() {
  const fingerDown = phraseFingers.size > 0;
  phraseRows.forEach((row, si) => {
    row.classList.toggle('playing', !!phrase && phrase.style === si);
    [...row.querySelectorAll('.pcell')].forEach((c, vi) => {
      const on = !!phrase && phrase.style === si && phrase.variation === vi;
      c.classList.toggle('on', on);
      c.classList.toggle('held', on && !fingerDown);
    });
  });
}

function sendPhrase(cell) {
  send({ type: 'phrase', style: cell ? cell.style : -1, variation: cell ? cell.variation : 0 });
  if (cell) phrase = cell;
  else if (!junoState.hold) phrase = null;
  renderPhrases();
  renderReadout();
}

function cellAt(e) {
  const r = phrasesEl.getBoundingClientRect();
  const style = Math.min(7, Math.max(0, Math.floor((e.clientY - r.top) / r.height * 8)));
  const variation = Math.min(3, Math.max(0, Math.floor((e.clientX - r.left) / r.width * 4)));
  return { style, variation };
}

const phraseFingers = new Map();   // pointerId -> cell; the newest finger leads
phrasesEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { phrasesEl.setPointerCapture(e.pointerId); } catch (err) {}
  const cell = cellAt(e);
  phraseFingers.delete(e.pointerId);
  phraseFingers.set(e.pointerId, cell);
  sendPhrase(cell);
});
phrasesEl.addEventListener('pointermove', (e) => {
  const old = phraseFingers.get(e.pointerId);
  if (!old) return;
  const cell = cellAt(e);
  if (cell.style === old.style && cell.variation === old.variation) return;
  phraseFingers.set(e.pointerId, cell);
  if ([...phraseFingers.keys()].pop() === e.pointerId) sendPhrase(cell);
});
function liftPhrase(e) {
  if (!phraseFingers.delete(e.pointerId)) return;
  const rest = [...phraseFingers.values()];
  sendPhrase(rest.length ? rest[rest.length - 1] : null);
}
phrasesEl.addEventListener('pointerup', liftPhrase);
phrasesEl.addEventListener('pointercancel', liftPhrase);

// iOS still scrolls and zooms on touchmove unless it is cancelled outright.
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// Open on C major, the way the instrument wakes up.
document.body.dataset.inst = 'omni';
selectChord(3);
</script>
